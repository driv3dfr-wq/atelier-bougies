<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Atelier Bougies V3</title>
<style>
  :root{
    --bg:#F3EEE4;
    --card:#FFFDF8;
    --ink:#1C2533;
    --ink-soft:#6E6A63;
    --border:#E2D9C8;
    --navy:#1D3050;
    --blue:#2B5585;
    --blue-soft:#E3EAF3;
    --red:#9C2B24;
    --red-soft:#F5E1DE;
    --amber:#B5721F;
    --amber-soft:#F6E7CF;
    --done:#2F7A4C;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; padding-bottom:150px; }
  button{ font-family:var(--sans); cursor:pointer; }
  input, select, textarea{ font-family:var(--sans); font-size:16px; color:var(--ink); }

  header.top{ position:sticky; top:0; z-index:10; background:var(--navy); color:#fff; padding:14px 16px 12px; box-shadow:0 4px 14px rgba(29,48,80,.22); border-bottom:3px solid var(--amber); }
  header.top h1{ margin:0; font-size:1.05rem; font-weight:700; letter-spacing:.01em; }
  header.top .sub{ font-size:.74rem; color:#B9C4D6; margin-top:2px; }

  main{ padding:14px 12px 0; max-width:680px; margin:0 auto; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2{ margin:0 0 10px; font-size:.95rem; }
  .muted{ color:var(--ink-soft); font-size:.8rem; }
  .small{ font-size:.76rem; }
  .row{ display:flex; gap:8px; align-items:center; }
  .row.wrap{ flex-wrap:wrap; }
  .grow{ flex:1; min-width:0; }
  .spacer{ height:8px; }

  .fld{ display:block; margin-bottom:10px; }
  .fld > span{ display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px; }
  .fld input, .fld select, .fld textarea, input.plain, select.plain, textarea.plain{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:#FBF8F2;
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--blue); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }

  .btn{ border:none; border-radius:9px; padding:10px 14px; font-size:.86rem; font-weight:700; background:var(--blue); color:#fff; }
  .btn:active{ transform:scale(.98); }
  .btn.red{ background:var(--red); }
  .btn.amber{ background:var(--amber); }
  .btn.ghost{ background:transparent; color:var(--blue); border:1.5px solid var(--blue); }
  .btn.light{ background:var(--blue-soft); color:var(--blue); }
  .btn.block{ display:block; width:100%; }
  .btn.sm{ padding:6px 10px; font-size:.76rem; border-radius:7px; }
  .xbtn{ border:none; background:transparent; color:var(--ink-soft); font-size:1rem; padding:4px 6px; }
  .xbtn:active{ color:var(--red); }
  .dashed{ display:block; width:100%; padding:11px; background:transparent; border:1.5px dashed var(--ink-soft); border-radius:9px; color:var(--ink-soft); font-size:.84rem; font-weight:700; }
  .dashed.blue{ border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{ border:1.5px solid var(--border); background:var(--card); border-radius:99px; padding:6px 12px; font-size:.78rem; font-weight:600; color:var(--ink-soft); }
  .chip.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .tag{ display:inline-block; font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:99px; background:var(--blue-soft); color:var(--blue); }
  .tag.idee{ background:#ECE7DD; color:var(--ink-soft); }
  .tag.planifie{ background:var(--blue-soft); color:var(--blue); }
  .tag.encours{ background:var(--amber-soft); color:var(--amber); }
  .tag.fait{ background:#DDEFE3; color:var(--done); }
  .tag.verre{ background:var(--amber-soft); color:var(--amber); }
  .tag.silicone{ background:var(--red-soft); color:var(--red); }

  .pcard{ display:flex; gap:12px; align-items:center; cursor:pointer; }
  .pcard .thumb{ width:56px; height:56px; border-radius:9px; background:var(--amber-soft); flex:none; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  .pcard .t{ font-weight:700; font-size:.95rem; }
  .pcard .d{ font-size:.76rem; color:var(--ink-soft); margin:2px 0 4px; text-transform:capitalize; }

  .item{ border:1px solid var(--border); border-left:4px solid var(--red); border-radius:10px; padding:12px; margin-bottom:10px; background:#FFFEFB; }
  .item.verre{ border-left-color:var(--amber); }
  .item .name{ font-weight:700; font-size:.95rem; }
  .qty{ display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .qty button{ border:none; background:var(--blue-soft); color:var(--blue); width:34px; height:32px; font-size:1.1rem; font-weight:700; }
  .qty span{ min-width:34px; text-align:center; font-weight:700; font-family:var(--mono); }
  .layer{ background:#F7F2E9; border-radius:9px; padding:9px; margin:8px 0; }
  .layer .row select{ width:100%; border:1px solid var(--border); border-radius:8px; padding:7px 8px; background:#fff; font-size:15px; }
  .layer .num{ width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff; font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .cchip{ display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border); border-radius:99px; padding:3px 4px 3px 8px; font-size:.78rem; margin:2px 4px 2px 0; }
  .dot{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.2); flex:none; }
  a.buy{ text-decoration:none; font-size:1.05rem; padding:2px 6px; border-radius:7px; background:var(--amber-soft); }
  .cchip button{ border:none; background:transparent; color:var(--ink-soft); padding:0 4px; }

  .summary{ background:var(--navy); color:#fff; border-radius:12px; padding:14px; margin-bottom:12px; }
  .summary .big{ font-size:1.5rem; font-weight:800; font-family:var(--mono); }
  .summary .lbl{ font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#B9C4D6; }
  .summary .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .summary ul{ margin:8px 0 0; padding-left:18px; font-size:.82rem; }
  .warn{ background:var(--amber-soft); color:#6B4512; border-radius:9px; padding:9px 11px; font-size:.8rem; margin-bottom:8px; }

  /* Check-list */
  .section{ background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .section-head{ display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; user-select:none; }
  .section-title{ flex:1; font-weight:700; font-size:.93rem; line-height:1.25; }
  .bar{ width:46px; height:6px; background:var(--border); border-radius:99px; overflow:hidden; }
  .bar .fill{ height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .3s; }
  .pct{ font-family:var(--mono); font-size:.68rem; color:var(--ink-soft); min-width:34px; text-align:right; }
  .pct.complete{ color:var(--done); font-weight:700; }
  .chev{ font-size:.7rem; color:var(--ink-soft); transition:transform .2s; }
  .section.open .chev{ transform:rotate(180deg); }
  .section-body{ display:none; border-top:1px solid var(--border); }
  .section.open .section-body{ display:block; }
  .steps{ padding:4px 14px 4px; }
  .step{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); }
  .step:last-child{ border-bottom:none; }
  .step input[type=checkbox]{ appearance:none; -webkit-appearance:none; width:22px; height:22px; min-width:22px; border:2px solid var(--ink-soft); border-radius:6px; position:relative; background:var(--card); margin-top:1px; }
  .step input[type=checkbox]:checked{ background:var(--done); border-color:var(--done); }
  .step input[type=checkbox]:checked::after{ content:''; position:absolute; left:6px; top:2px; width:6px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .step .txt{ flex:1; font-size:.9rem; line-height:1.4; }
  .step.done .txt{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--done); }
  .step .note{ display:block; font-size:.76rem; color:var(--ink-soft); margin-top:3px; }
  .step.par .txt{ color:var(--blue); font-weight:600; }
  .temp{ display:inline-block; font-family:var(--mono); font-weight:800; font-size:.8rem; background:var(--amber-soft); color:var(--amber); border-radius:6px; padding:1px 6px; margin-right:4px; }
  .subhead{ font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--navy); padding:12px 0 4px; border-bottom:2px solid var(--navy); margin-bottom:2px; }
  .timerbtn{ border:none; background:var(--blue); color:#fff; border-radius:7px; padding:6px 10px; font-size:.78rem; font-weight:700; white-space:nowrap; }
  .add-row{ display:flex; gap:8px; padding:8px 14px 14px; }
  .add-row input{ flex:1; min-width:0; border:1px solid var(--border); border-radius:7px; padding:8px 10px; background:#FBF8F2; }
  .progress-big{ height:8px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden; margin-top:8px; }
  .progress-big .fill{ height:100%; background:var(--amber); width:0; transition:width .3s; }

  /* Timers */
  #timerBar{ position:fixed; left:0; right:0; bottom:62px; z-index:30; display:flex; flex-direction:column; gap:6px; padding:0 10px; pointer-events:none; }
  .tmr{ pointer-events:auto; max-width:660px; margin:0 auto; width:100%; display:flex; align-items:center; gap:10px; background:var(--navy); color:#fff; border-radius:12px; padding:9px 12px; box-shadow:0 6px 18px rgba(0,0,0,.25); border-left:5px solid var(--amber); }
  .tmr .clock{ font-family:var(--mono); font-size:1.25rem; font-weight:800; }
  .tmr.fired{ background:var(--red); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:.75; } }
  .tmr .lab{ flex:1; font-size:.78rem; color:#D5DCE7; }
  .tmr button{ border:none; background:rgba(255,255,255,.15); color:#fff; border-radius:7px; padding:6px 9px; font-weight:700; }

  /* Bottom nav */
  nav.bottom{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -4px 14px rgba(29,48,80,.08); }
  nav.bottom button{ flex:1; border:none; background:transparent; padding:8px 2px 9px; font-size:.68rem; font-weight:700; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav.bottom button .ic{ font-size:1.2rem; line-height:1; }
  nav.bottom button.on{ color:var(--navy); box-shadow:inset 0 3px 0 var(--amber); }

  /* Library */
  details.lib{ background:var(--card); border:1px solid var(--border); border-radius:11px; margin-bottom:8px; }
  details.lib > summary{ list-style:none; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  details.lib > summary::-webkit-details-marker{ display:none; }
  details.lib > summary .n{ flex:1; font-weight:700; font-size:.9rem; }
  details.lib > summary .v{ font-family:var(--mono); font-size:.8rem; color:var(--ink-soft); }
  details.lib[open] > summary{ border-bottom:1px solid var(--border); }
  details.lib .body{ padding:12px 14px; }
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin:8px 0; }
  .ph{ position:relative; }
  .ph img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:var(--amber-soft); display:block; }
  .ph .cap{ font-size:.68rem; color:var(--ink-soft); text-align:center; margin-top:2px; }
  .ph .del{ position:absolute; top:3px; right:3px; border:none; background:rgba(0,0,0,.55); color:#fff; border-radius:50%; width:22px; height:22px; font-size:.7rem; }
  .ph select, .ph input{ width:100%; font-size:.7rem; padding:3px; border:1px solid var(--border); border-radius:5px; margin-top:3px; background:#fff; }
  #viewer{ position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; }
  #viewer img{ max-width:96%; max-height:84vh; border-radius:6px; }
  #viewer .cap{ color:#fff; margin-top:10px; font-size:.85rem; }

  .toast{ position:fixed; bottom:140px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; font-size:.8rem; padding:8px 16px; border-radius:99px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; text-align:center; max-width:86%; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .empty{ text-align:center; padding:28px 16px; color:var(--ink-soft); font-size:.88rem; }
  .empty .ic{ font-size:2.2rem; display:block; margin-bottom:6px; }
  input[type=range]{ width:100%; accent-color:var(--blue); }
  .seg{ display:flex; border:1.5px solid var(--navy); border-radius:9px; overflow:hidden; }
  .seg button{ flex:1; border:none; background:transparent; padding:8px 6px; font-size:.78rem; font-weight:700; color:var(--navy); }
  .seg button.on{ background:var(--navy); color:#fff; }
  @media (max-width:380px){ .grid3{ grid-template-columns:1fr 1fr; } }

  /* Pavé numérique (température) */
  .kp-ov{ position:fixed; inset:0; z-index:80; background:rgba(15,22,34,.75); display:flex; align-items:flex-end; justify-content:center; }
  .kp{ background:var(--card); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); }
  .kp-t{ font-weight:800; text-align:center; margin-bottom:4px; }
  .kp-disp{ font-family:var(--mono); font-size:2.6rem; font-weight:800; text-align:center; color:var(--amber); margin:6px 0 12px; }
  .kp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kp-grid button{ border:none; border-radius:12px; background:var(--blue-soft); color:var(--navy); font-size:1.6rem; font-weight:800; padding:16px 0; }
  .kp-grid button.ok{ background:var(--done); color:#fff; font-size:1.2rem; }

  /* Planning */
  .gantt{ margin-top:6px; }
  .g-row{ display:flex; align-items:center; gap:8px; margin:6px 0; }
  .g-lab{ width:70px; font-size:.72rem; font-weight:700; color:var(--ink-soft); }
  .g-track{ position:relative; flex:1; height:18px; background:#EFE8DA; border-radius:6px; overflow:hidden; }
  .g-bar{ position:absolute; top:2px; bottom:2px; border-radius:4px; opacity:.9; }
  .g-axis{ display:flex; justify-content:space-between; margin-left:78px; font-family:var(--mono); font-size:.68rem; color:var(--ink-soft); }

  /* Mode atelier plein écran */
  .at-ov{ position:fixed; inset:0; z-index:70; background:var(--navy); color:#fff; display:flex; flex-direction:column; user-select:none; }
  .at-top{ display:flex; align-items:center; gap:8px; padding:12px; }
  .at-top button{ border:none; background:rgba(255,255,255,.14); color:#fff; border-radius:10px; padding:10px 14px; font-size:1rem; font-weight:700; }
  .at-main{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:16px 22px; cursor:pointer; }
  .at-sec{ font-size:.9rem; color:#B9C4D6; margin-bottom:10px; }
  .at-temp{ display:inline-block; align-self:flex-start; font-family:var(--mono); font-size:2.2rem; font-weight:800; background:var(--amber); color:#fff; border-radius:12px; padding:4px 14px; margin-bottom:14px; }
  .at-text{ font-size:1.7rem; font-weight:700; line-height:1.3; }
  .at-note{ font-size:1rem; color:#D5DCE7; margin-top:12px; }
  .at-hint{ font-size:.8rem; color:#8FA0BA; margin-top:24px; }
  .at-who{ align-self:flex-start; font-size:1.35rem; font-weight:800; background:#fff; color:var(--navy); border-radius:12px; padding:6px 14px; margin-bottom:12px; }
  .at-prev, .at-next{ font-size:.95rem; line-height:1.35; color:#8FA0BA; border-radius:10px; padding:8px 12px; background:rgba(255,255,255,.06); }
  .at-prev{ margin-bottom:18px; } .at-next{ margin-top:18px; color:#B9C4D6; }
  .at-prev b, .at-next b{ display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
  .at-main{ overflow-y:auto; }
  .at-pred{ margin:0 12px 8px; padding:10px 12px; border-radius:10px; background:rgba(181,114,31,.25); color:#F3C77A; font-size:.95rem; font-weight:600; }
  .at-bot{ display:flex; gap:8px; padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px)); flex-wrap:wrap; }
  .at-bot button{ flex:1; min-width:30%; border:none; border-radius:12px; padding:16px 8px; font-size:1rem; font-weight:800; background:rgba(255,255,255,.14); color:#fff; }
  .at-bot button.hi{ background:var(--amber); }
  body:has(.at-ov) #timerBar{ z-index:75; top:64px; bottom:auto; }

  /* Étoiles (carnet) et graphique (stats) */
  .stars{ display:flex; gap:2px; }
  .stars button{ border:none; background:transparent; font-size:1.35rem; color:#D8CFBF; padding:0 2px; line-height:1; }
  .stars button.on{ color:var(--amber); }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:140px; padding-top:14px; }
  .bcol{ flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .bbar{ width:100%; background:var(--blue); border-radius:4px 4px 0 0; min-height:2px; }
  .bval{ font-size:.66rem; font-family:var(--mono); color:var(--ink-soft); }
  .blab{ font-size:.6rem; color:var(--ink-soft); margin-top:3px; }

  /* Aperçu 3D */
  .v3-ov{ position:fixed; inset:0; z-index:85; background:#1C2638; display:flex; flex-direction:column; }
  .v3-top{ display:flex; align-items:center; gap:6px; padding:10px; color:#fff; }
  .v3-top button{ border:none; background:rgba(255,255,255,.14); color:#fff; border-radius:9px; padding:8px 12px; font-weight:700; }
  .v3-top button.on{ background:var(--blue); }
  .v3-cv{ flex:1; width:100%; touch-action:none; display:block; }
  .v3-hint{ color:#8FA0BA; font-size:.75rem; text-align:center; padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); }
  nav.bottom button{ font-size:.62rem; }
  .lthumb{ width:40px; height:40px; border-radius:8px; background:var(--amber-soft); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex:none; overflow:hidden; }
  .lthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  details.supgrp{ margin-bottom:8px; }
  details.supgrp > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--amber-soft); border-radius:11px; cursor:pointer; font-weight:800; }
  details.supgrp > summary::-webkit-details-marker{ display:none; }
  details.supgrp > summary::before{ content:'▸'; color:var(--amber); transition:transform .15s; }
  details.supgrp[open] > summary::before{ transform:rotate(90deg); }
  details.supgrp > summary .n{ flex:1; }
  details.supgrp > summary .cnt{ font-weight:600; font-size:.8rem; color:var(--ink-soft); }
  details.supgrp > .supgrp-body{ padding:8px 0 4px 8px; }
</style>
</head>
<body>

<header class="top">
  <h1 id="hTitle">Atelier Bougies V3</h1>
  <div class="sub" id="hSub"></div>
</header>

<main id="app"></main>

<div id="timerBar"></div>

<nav class="bottom" id="nav">
  <button data-tab="projets"><span class="ic">📒</span>Projets</button>
  <button data-tab="prep"><span class="ic">📨</span>Préparation</button>
  <button data-tab="checklist"><span class="ic">✅</span>Check-list</button>
  <button data-tab="biblio"><span class="ic">🕯️</span>Bibliothèque</button>
  <button data-tab="silicone"><span class="ic">🧪</span>Moules</button>
  <button data-tab="reglages"><span class="ic">⚙️</span>Réglages</button>
</nav>

<div id="viewer"><img alt=""><div class="cap"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="jsonInput" accept="application/json,.json" style="display:none">

<script type="text/plain" id="inviteTpl">
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>@@TITLE@@</title>
<style>
  :root{
    --paper:#FBF6EC; --card:#FFFDF8; --ink:#1C2533; --soft:#6E6A63; --line:#E6DCC8;
    --night:#16233B; --night2:#24365A; --gold:#D9A441; --gold-soft:#F6E7CF; --rose:#C8574B; --green:#2F7A4C;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.45;
        background-image:radial-gradient(circle at 12% 18%, rgba(217,164,65,.08) 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, rgba(200,87,75,.06) 0 2px, transparent 3px);
        background-size:38px 38px, 52px 52px; }

  /* --- En-tête --- */
  .hero{ position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 120%, #3B4F7A 0%, var(--night2) 35%, var(--night) 75%); color:#fff; text-align:center; padding:34px 16px 30px; }
  .hero .stars{ position:absolute; inset:0; pointer-events:none; }
  .hero .stars i{ position:absolute; width:3px; height:3px; border-radius:50%; background:#FCE9B8; opacity:.7; animation:tw 3s ease-in-out infinite; }
  @keyframes tw{ 50%{ opacity:.15; } }
  .hero .kicker{ font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .hero h1{ font-family:var(--serif); font-weight:700; font-size:clamp(1.9rem, 7vw, 2.8rem); margin:6px 0 4px; line-height:1.1; }
  .hero .host{ color:#C9D3E6; font-size:.95rem; }
  .candles{ display:flex; justify-content:center; align-items:flex-end; gap:14px; margin:18px auto 6px; height:120px; }
  .flame{ transform-origin:50% 100%; animation:flick 1.6s ease-in-out infinite alternate; }
  .flame.b{ animation-duration:1.25s; } .flame.c{ animation-duration:1.9s; }
  @keyframes flick{ 0%{ transform:scale(1,1) rotate(-2deg); } 40%{ transform:scale(.92,1.08) rotate(2deg); } 100%{ transform:scale(1.04,.95) rotate(-1deg); } }
  .glow{ animation:glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow{ from{ opacity:.7; } to{ opacity:1; } }

  .wrap{ max-width:720px; margin:0 auto; padding:0 16px 120px; }
  .facts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin:-18px 0 18px; position:relative; z-index:2; }

  .fact .v{ font-weight:700; margin-top:2px; }
  .msg{ font-family:var(--serif); font-size:1.08rem; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:18px; white-space:pre-line; position:relative; }

  .deadline{ background:var(--gold-soft); color:#6B4512; border-radius:12px; padding:10px 14px; font-size:.9rem; margin-bottom:18px; }

  h2.sec{ font-family:var(--serif); font-size:1.45rem; margin:28px 0 4px; }
  .sub{ color:var(--soft); font-size:.88rem; margin-bottom:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(22,35,59,.04); }
  .fld{ display:block; margin-bottom:12px; }

  .fld input, .fld select, .fld textarea{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#FFFEFB; }

  /* --- Bougie --- */

  .chead h3{ margin:0; font-family:var(--serif); font-size:1.25rem; flex:1; }
  .xbtn{ border:1px solid var(--line); background:#fff; border-radius:99px; padding:5px 12px; color:var(--soft); font-size:.8rem; }
  .step{ font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--night2); margin:16px 0 8px; display:flex; align-items:center; gap:8px; }
  .step b{ width:22px; height:22px; border-radius:50%; background:var(--night); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:.72rem; letter-spacing:0; }
  .molds{ display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:10px; }
  .mold{ position:relative; border:2px solid var(--line); border-radius:14px; background:#fff; padding:0; overflow:hidden; text-align:left; transition:transform .12s, border-color .12s; }
  .mold:hover{ transform:translateY(-2px); }
  .mold.on{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,.25); }
  .mold.taken{ opacity:.45; cursor:not-allowed; }
  .mold .pic{ height:96px; display:flex; align-items:center; justify-content:center; font-size:2.6rem; background:linear-gradient(135deg,#F7EEDD,#EADCC2); }
  .mold .pic img{ width:100%; height:100%; object-fit:cover; display:block; }
  .mold .nm{ font-weight:700; font-size:.86rem; padding:7px 9px 0; }
  .mold .mt{ font-size:.72rem; color:var(--soft); padding:0 9px 8px; }

  .badge.multi{ background:rgba(47,122,76,.9); }

  .check{ position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#fff; display:none; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; }

  .alt select{ width:100%; margin-top:6px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:#fff; }

  .styles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; }

  .style .d{ font-size:.76rem; color:var(--soft); }

  .sw{ display:flex; flex-wrap:wrap; gap:8px; }

  .swatch .dot{ width:22px; height:22px; border-radius:50%; border:1px solid rgba(0,0,0,.18); flex:none; }
  .swatch.on{ border-color:var(--night); background:#EEF1F7; font-weight:700; }
  .swatch .n{ position:absolute; top:-7px; left:-5px; width:18px; height:18px; border-radius:50%; background:var(--night); color:#fff; font-size:.66rem; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .swatch[disabled]{ opacity:.4; cursor:not-allowed; }
  .hint{ font-size:.8rem; color:var(--soft); margin:-2px 0 8px; }
  .typ{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin:10px 0 6px; }

  .result{ display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center; margin-top:16px; padding:14px; border-radius:14px; background:linear-gradient(135deg,#1F2F4F,#16233B); color:#fff; }
  .result svg{ width:120px; height:150px; }
  .result .lbl{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:#C9D3E6; }
  .result .price{ font-size:1.6rem; font-weight:800; color:#F3C77A; }
  .result .desc{ font-size:.84rem; color:#E7ECF5; margin-top:4px; }

  .addc{ width:100%; border:2px dashed var(--gold); background:transparent; border-radius:14px; padding:14px; font-weight:800; color:#8A5A12; font-size:.95rem; }
  .total{ background:var(--night); color:#fff; border-radius:16px; padding:16px; margin:18px 0; }
  .total .row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; font-size:.9rem; }
  .total .big{ font-size:1.7rem; font-weight:800; color:#F3C77A; }
  .btn{ display:block; width:100%; border:none; border-radius:12px; padding:14px; font-weight:800; font-size:1rem; margin-bottom:10px; }
  .btn.gold{ background:linear-gradient(135deg,#E2B04E,#C98E2C); color:#2B1A02; box-shadow:0 6px 16px rgba(201,142,44,.35); }
  .btn.ghost{ background:#fff; color:var(--night); border:1.5px solid var(--night); }
  .ok{ background:#DDEFE3; color:var(--green); border-radius:12px; padding:12px 14px; font-size:.9rem; margin-bottom:12px; }
  .warn{ background:#F5E1DE; color:#7A231C; border-radius:12px; padding:10px 14px; font-size:.86rem; margin-bottom:10px; }

  .tech-list{ display:grid; gap:10px; }
  .tech{ display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center; }
  .tech svg{ width:96px; height:80px; }
  .tech h4{ margin:0 0 3px; font-size:.95rem; }
  .tech p{ margin:0; font-size:.84rem; color:var(--soft); }
  details.card summary{ cursor:pointer; font-weight:800; }
  footer{ text-align:center; color:var(--soft); font-size:.78rem; margin:30px 0 0; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(40px); background:var(--night); color:#fff; padding:10px 16px; border-radius:99px; font-size:.86rem; opacity:0; transition:.25s; z-index:50; max-width:90vw; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media print{ .btn, .addc, .xbtn{ display:none; } }
</style>
</head>

const D = @@DATA@@;
const LSK = "invit_bougies_"+D.id;
const $ = id => document.getElementById(id);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k==="style") el.style.cssText = v;
    else if(k==="html") el.innerHTML = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="value" || k==="checked" || k==="disabled" || k==="selected") el[k] = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  kids.flat(9).forEach(c=>{ if(c==null || c===false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
function money(n){ return n==null||isNaN(n) ? "à confirmer" : Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" "+(D.currency||"€"); }
function fmtDate(s){ if(!s) return ""; const d=new Date(s+"T12:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
const mold = id => D.molds.find(m=>m.id===id);
const col  = id => D.colors.concat(D.pens, D.glitter).find(c=>c.id===id);
const frag = id => D.frags.find(f=>f.id===id);

/* ---------- Techniques proposées ---------- */
const STYLES = {
  uni:     { name:"Uni",        min:0, max:1, short:"Une seule couleur, ou la cire naturelle.", long:"La cire est colorée d'une seule teinte puis coulée en une fois. Simple, élégant, et parfait pour mettre en valeur un beau moule.", hint:"Choisis 1 couleur (ou aucune pour la cire naturelle, couleur crème)." },
  couches: { name:"En couches", min:2, max:3, short:"2 ou 3 bandes de couleurs.", long:"On coule une première couleur, on attend qu'elle prenne, puis on coule la suivante. Dans un moule en silicone, la 1re couleur coulée se retrouve en haut de la bougie ; dans un pot, elle reste au fond.", hint:"Choisis 2 ou 3 couleurs, dans l'ordre où elles seront coulées." },
  marbre:  { name:"Marbré",     min:2, max:3, short:"Couleurs mêlées en volutes.", long:"Les couleurs sont coulées en alternance puis mélangées très légèrement avec une pique : chaque bougie est unique, comme une pierre de marbre.", hint:"Choisis 2 ou 3 couleurs à marbrer." },
  pinceau: { name:"Détails au pinceau", min:1, max:2, short:"Reliefs peints, puis fond coulé.", long:"On peint d'abord au pinceau les reliefs du moule (pétales, écailles, yeux…) avec un peu de cire colorée, puis on coule le fond d'une autre couleur. Idéal pour les moules très détaillés.", hint:"1re couleur = les détails peints ; 2e couleur = le fond (facultatif, sinon naturel)." }
};
const ADDONS = {
  paillettes: { name:"Paillettes", long:"Quelques paillettes ajoutées dans la cire pour un effet scintillant (elles ne colorent pas)." },
  stylo:      { name:"Déco au stylo", long:"Après le démoulage, on dessine sur la bougie avec des stylos à peinture spéciaux : contours, motifs, prénoms…" }
};
const styleOn = k => (D.styles||[]).includes(k);
const baseStyles = () => Object.keys(STYLES).filter(styleOn);

/* ---------- Dessin des bougies (aperçu) ---------- */
const NATUREL = "#F3E9D2";
function shade(hex, f){ const n = parseInt((hex||"#cccccc").slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  r=Math.round(Math.min(255,Math.max(0,r*f))); g=Math.round(Math.min(255,Math.max(0,g*f))); b=Math.round(Math.min(255,Math.max(0,b*f)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
let svgN = 0;
function candleSVG(c, w, hgt, opts){
  opts = opts||{};
  const m = mold(c.mold), verre = m && m.kind==="verre";
  const cols = (c.colors||[]).map(id=>(col(id)||{}).hex).filter(Boolean);
  const id = "cg"+(++svgN);
  const W=100, H=130, x0=22, x1=78, top=40, bot=124;
  const parts = [];
  const body = verre ? `M${x0} ${top} L${x1} ${top} L${x1-3} ${bot} Q50 ${bot+4} ${x0+3} ${bot}Z` : `M${x0} ${top+6} Q${x0} ${top} ${x0+6} ${top} L${x1-6} ${top} Q${x1} ${top} ${x1} ${top+6} L${x1} ${bot-6} Q${x1} ${bot} ${x1-6} ${bot} L${x0+6} ${bot} Q${x0} ${bot} ${x0} ${bot-6}Z`;
  parts.push(`<defs><clipPath id="${id}"><path d="${body}"/></clipPath><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>`);
  // flamme
  parts.push(`<ellipse cx="50" cy="20" rx="16" ry="16" fill="#F7C873" opacity=".25"/><path d="M50 6 C56 15 57 21 50 30 C43 21 44 15 50 6Z" fill="#FFC75A"/><path d="M50 15 C53 19 53 23 50 28 C47 23 47 19 50 15Z" fill="#FFF4D6"/><rect x="49.2" y="29" width="1.6" height="${top-29+2}" fill="#333"/>`);
  const g = [];
  const base = cols[0] || NATUREL;
  const st = c.style || "uni";
  if(st==="couches" && cols.length){
    const n = cols.length, hh = (bot-top)/n;
    // silicone : la 1re couche coulée = le haut ; verre : le fond
    cols.forEach((cc,i)=>{ const k = verre ? n-1-i : i; g.push(`<rect x="0" y="${top+k*hh}" width="${W}" height="${hh+1}" fill="${cc}"/>`); });
  } else if(st==="marbre" && cols.length){
    g.push(`<rect x="0" y="${top}" width="${W}" height="${bot-top}" fill="${cols[0]}"/>`);
    cols.slice(1).concat(cols.length===1?[shade(cols[0],1.25)]:[]).forEach((cc,i)=>{
      const o = i*13;
      g.push(`<path d="M10 ${top+12+o} C35 ${top+2+o}, 45 ${top+38+o}, 70 ${top+22+o} S95 ${top+44+o}, 92 ${top+58+o} C70 ${top+70+o}, 50 ${top+44+o}, 28 ${top+64+o} S5 ${top+50+o}, 10 ${top+12+o}Z" fill="${cc}" opacity=".9"/>`);
      g.push(`<path d="M0 ${top+80-o} C25 ${top+70-o}, 45 ${top+96-o}, 100 ${top+78-o}" stroke="${cc}" stroke-width="7" fill="none" opacity=".85"/>`);
    });
  } else if(st==="pinceau"){
    const fond = cols[1] || NATUREL, det = cols[0] || "#C0C4CA";
    g.push(`<rect x="0" y="${top}" width="${W}" height="${bot-top}" fill="${fond}"/>`);
    [[36,62],[60,58],[48,84],[34,100],[64,96],[50,112],[42,74],[58,76]].forEach(([cx,cy],i)=>{
      g.push(`<path d="M${cx} ${cy-7} Q${cx+6} ${cy} ${cx} ${cy+7} Q${cx-6} ${cy} ${cx} ${cy-7}Z" fill="${det}" transform="rotate(${i*40} ${cx} ${cy})"/>`); });
  } else {
    g.push(`<rect x="0" y="${top}" width="${W}" height="${bot-top}" fill="${base}"/>`);
  }
  if(c.glitter){ const gc = (col(c.glitter)||{}).hex || "#E8D9A8"; for(let i=0;i<34;i++){ const x = 24+((i*37)%54), y = top+4+((i*53)%(bot-top-8)); g.push(`<circle cx="${x}" cy="${y}" r="${i%3?0.9:1.6}" fill="${gc}" opacity=".95"/>`); } }
  (c.pens||[]).forEach((pid,i)=>{ const pc = (col(pid)||{}).hex || "#222"; const y = top+20+i*26;
    g.push(`<path d="M24 ${y} q6 -7 12 0 t12 0 t12 0 t12 0 t12 0" stroke="${pc}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`);
    g.push(`<circle cx="50" cy="${y+12}" r="3.2" fill="none" stroke="${pc}" stroke-width="2"/>`); });
  parts.push(`<g clip-path="url(#${id})">${g.join("")}<rect x="0" y="0" width="${W}" height="${H}" fill="url(#${id}s)"/></g>`);
  if(verre) parts.push(`<path d="M${x0-4} ${top-6} L${x1+4} ${top-6} L${x1+1} ${bot+3} Q50 ${bot+8} ${x0-1} ${bot+3}Z" fill="#BFD7E6" opacity=".22" stroke="#9FB9CC" stroke-width="1.5"/>`);
  else parts.push(`<ellipse cx="50" cy="${top+1}" rx="26" ry="3" fill="#fff" opacity=".25"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="${w}" height="${hgt}" xmlns="http://www.w3.org/2000/svg">${parts.join("")}</svg>`;
}
function svgEl(str){ const d = h("div",{ html:str }); return d.firstChild; }

/* ---------- État (gardé dans ce navigateur pour pouvoir revenir) ---------- */
const newCandle = ()=>({ mold:"", alt:"", style: baseStyles()[0] || "uni", colors:[], glitter:"", pens:[], frag:"", note:"" });
let S;
try{ S = JSON.parse(localStorage.getItem(LSK)||"null"); }catch(e){ S = null; }
if(!S || !Array.isArray(S.candles)) S = { name:D.guest||"", email:"", comment:"", candles:[newCandle()], sent:null };
if(D.guest && !S.name) S.name = D.guest;
function save(){ try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){} }

/* ---------- Prix ---------- */
function layerGrams(c, m){
  const w = +m.weight||0, P = D.prices, cols = c.colors||[], out = [];
  const st = c.style;
  if(st==="pinceau"){ if(cols[0]) out.push([cols[0], P.brush]); if(cols[1]) out.push([cols[1], w]); }
  else if(cols.length) cols.forEach(id=> out.push([id, w/cols.length]));
  return out;
}
function candleCost(c){
  const m = mold(c.mold); if(!m) return { cost:null };
  if(!(+m.weight>0)) return { cost:null, unknown:true };
  const P = D.prices, mg = 1+(+P.margin||0)/100, w = +m.weight;
  const brush = c.style==="pinceau" ? (+P.brush||5) : 0;
  if(P.waxPerG==null) return { cost:null, unknown:true };
  let cost = (w+brush)*mg*P.waxPerG;
  if(c.frag){ const f = frag(c.frag); if(f && f.perG!=null) cost += w*mg*f.perG; }
  layerGrams(c, m).forEach(([id,g])=>{ const k = (P.mica||{})[id]; if(k!=null) cost += g*mg*k; });
  return { cost, grams: Math.round((w+brush)*mg) };
}

/* ---------- Rendu ---------- */
function stars(){
  const s = $("stars");
  for(let i=0;i<38;i++){ const e = document.createElement("i"); e.style.left = (Math.random()*100)+"%"; e.style.top = (Math.random()*80)+"%"; e.style.animationDelay = (Math.random()*3)+"s"; if(i%5===0){ e.style.width = e.style.height = "4px"; } s.append(e); }
}
function head(){
  document.title = D.title || "Atelier bougies";
  $("hTitle").textContent = D.title || "Atelier bougies";
  $("hHost").textContent = (D.guest ? "Bonjour "+D.guest+" ! " : "")+(D.host ? D.host+" t'invite à créer tes bougies" : "Viens créer tes bougies");
  const F = $("facts");
  [["Date", D.date ? fmtDate(D.date) : "à définir"], ["Heure", D.time||"à définir"], ["Lieu", D.place||"à définir"]].forEach(([l,v])=> F.append(h("div",{class:"fact"}, h("div",{class:"l"},l), h("div",{class:"v"},v))));
  $("msg").textContent = D.message || "";
  if(!D.message) $("msg").style.display = "none";
  if(D.deadline){
    const days = Math.ceil((new Date(D.deadline+"T23:59:00") - new Date())/86400000);
    $("deadline").append(h("div",{class:"deadline"}, "⏳ Réponds avant le ", h("b",{}, fmtDate(D.deadline)), days>=0 ? " ("+(days===0?"c'est aujourd'hui !":"dans "+days+" jour"+(days>1?"s":""))+")" : " (date dépassée : réponds quand même, on s'arrangera !)"));
  }
  $("foot").textContent = "Invitation créée avec l'Atelier Bougies"+(D.host?" de "+D.host:"")+" · mise à jour le "+new Date(D.generated).toLocaleDateString("fr-FR");
  const nm = $("fName"), em = $("fEmail"), cm = $("fComment");
  nm.value = S.name||""; em.value = S.email||""; cm.value = S.comment||"";
  nm.addEventListener("input", ()=>{ S.name = nm.value; save(); renderSend(); });
  em.addEventListener("input", ()=>{ S.email = em.value; save(); });
  cm.addEventListener("input", ()=>{ S.comment = cm.value; save(); });
  $("addCandle").addEventListener("click", ()=>{ if(S.candles.length < (D.maxCandles||2)){ S.candles.push(newCandle()); save(); renderCandles(); renderTotal(); window.scrollBy(0, 200); } });
}

function swatch(c, on, n, onclick, disabled){
  return h("button",{ type:"button", class:"swatch"+(on?" on":""), disabled, onclick },
    n ? h("span",{class:"n"}, n) : null, h("span",{class:"dot", style:"background:"+c.hex}), c.name);
}
function cleanName(n){ return (n||"").replace(/^(Mica|Copeaux|Paillettes|Stylo)\s+/i,""); }

function renderCandle(c, i){
  const card = h("div",{class:"card candle-card"});
  const redraw = ()=>{ const n = renderCandle(c,i); card.replaceWith(n); renderTotal(); save(); };
  card.append(h("div",{class:"chead"}, h("h3",{}, "Bougie "+(i+1)),
    S.candles.length>1 ? h("button",{class:"xbtn", onclick:()=>{ if(confirm("Retirer la bougie "+(i+1)+" ?")){ S.candles.splice(i,1); save(); renderCandles(); renderTotal(); } }},"Retirer") : null));

  // 1. Moule
  card.append(h("div",{class:"step"}, h("b",{},"1"), "Choisis ton moule"));
  const grid = h("div",{class:"molds"});
  D.molds.forEach(m=>{
    const taken = m.full && c.mold!==m.id;
    const pic = h("div",{class:"pic"}); if(m.photo) pic.append(h("img",{ src:m.photo, alt:m.name, loading:"lazy" })); else pic.append(m.emoji||"🕯️");
    const badge = m.full ? h("span",{class:"badge full"},"Complet") : (m.copies>1 ? h("span",{class:"badge multi"}, m.copies+" moules") : m.kind==="verre" ? h("span",{class:"badge"},"Pot en verre") : h("span",{class:"badge"},"Moule unique"));
    grid.append(h("button",{ type:"button", class:"mold"+(c.mold===m.id?" on":"")+(taken?" taken":""), disabled:taken, onclick:()=>{ c.mold = m.id; if(c.alt===m.id) c.alt=""; redraw(); } },
      pic, badge, h("span",{class:"check"},"✓"),
      h("div",{class:"nm"}, m.name),
      h("div",{class:"mt"}, [m.weight ? "≈ "+m.weight+" g de cire" : "poids à confirmer", (m.cavities>1 ? m.cavities+" petites bougies" : null), m.kind==="verre" ? "tu repars avec le pot" : null].filter(Boolean).join(" · "))));
  });
  card.append(grid);
  const sel = mold(c.mold);
  if(sel && sel.note) card.append(h("div",{class:"hint", style:"margin-top:8px"}, "ℹ️ "+sel.note));
  if(sel && sel.kind!=="verre" && !(sel.copies>1)){
    const alts = D.molds.filter(m=>m.id!==c.mold && !m.full);
    const s = h("select",{ onchange:e=>{ c.alt = e.target.value; save(); renderTotal(); } },
      h("option",{value:""},"Peu importe, choisis pour moi"),
      alts.map(m=>h("option",{ value:m.id, selected:c.alt===m.id }, m.name+(m.weight?" ("+m.weight+" g)":""))));
    card.append(h("div",{class:"alt"}, "🔁 Ce moule n'existe qu'en un exemplaire. ", h("b",{},"Ton 2e choix"), " s'il est déjà pris :", s));
  }

  // 2. Technique
  const bs = baseStyles();
  if(bs.length>1){
    card.append(h("div",{class:"step"}, h("b",{},"2"), "Choisis la technique"));
    const sg = h("div",{class:"styles"});
    bs.forEach(k=>{
      const demo = { mold:c.mold, style:k, colors: c.colors.length ? c.colors.slice(0, STYLES[k].max) : demoColors(k) };
      if(k!=="uni" && demo.colors.length<2) demo.colors = demoColors(k);
      sg.append(h("button",{ type:"button", class:"style"+(c.style===k?" on":""), onclick:()=>{ c.style = k; c.colors = c.colors.slice(0, STYLES[k].max); redraw(); } },
        svgEl(candleSVG(demo, "100%", 64)), h("span",{class:"t"}, STYLES[k].name), h("span",{class:"d"}, STYLES[k].short)));
    });
    card.append(sg);
  }

  // 3. Couleurs
  const ST = STYLES[c.style] || STYLES.uni;
  card.append(h("div",{class:"step"}, h("b",{},bs.length>1?"3":"2"), "Choisis tes couleurs"));
  card.append(h("div",{class:"hint"}, ST.hint));
  const types = [["copeaux","Teintes douces (copeaux)"],["poudre","Teintes nacrées (mica)"],["liquide","Colorant liquide"]];
  types.forEach(([t,label])=>{
    const L = D.colors.filter(x=>x.type===t); if(!L.length) return;
    card.append(h("div",{class:"typ"}, label));
    card.append(h("div",{class:"sw"}, L.map(x=>{
      const idx = c.colors.indexOf(x.id), on = idx>=0, full = !on && c.colors.length>=ST.max;
      return swatch({ hex:x.hex, name:cleanName(x.name) }, on, on && ST.max>1 ? idx+1 : null, ()=>{
        if(on) c.colors.splice(idx,1); else if(ST.max===1) c.colors=[x.id]; else if(!full) c.colors.push(x.id);
        redraw(); }, false);
    })));
  });
  if(c.colors.length < ST.min) card.append(h("div",{class:"warn", style:"margin-top:8px"}, "Encore "+(ST.min-c.colors.length)+" couleur(s) à choisir pour cette technique."));
  if(styleOn("paillettes") && D.glitter.length){
    card.append(h("div",{class:"typ"}, "✨ Paillettes (en option)"));
    card.append(h("div",{class:"sw"}, D.glitter.map(x=> swatch({ hex:x.hex, name:cleanName(x.name) }, c.glitter===x.id, null, ()=>{ c.glitter = c.glitter===x.id ? "" : x.id; redraw(); }))));
  }
  if(styleOn("stylo") && D.pens.length){
    card.append(h("div",{class:"typ"}, "🖊️ Déco au stylo après démoulage (en option, 3 max)"));
    card.append(h("div",{class:"sw"}, D.pens.map(x=>{ const on = c.pens.includes(x.id);
      return swatch({ hex:x.hex, name:cleanName(x.name) }, on, null, ()=>{ if(on) c.pens = c.pens.filter(y=>y!==x.id); else if(c.pens.length<3) c.pens.push(x.id); redraw(); }); })));
  }

  // 4. Parfum
  if(D.frags.length){
    card.append(h("div",{class:"step"}, h("b",{},bs.length>1?"4":"3"), "Choisis un parfum"));
    card.append(h("div",{class:"sw"},
      swatch({ hex:"#FFFFFF", name:"Sans parfum" }, !c.frag, null, ()=>{ c.frag=""; redraw(); }),
      D.frags.map(f=> swatch({ hex:f.hex||"#F4D9E4", name:f.name }, c.frag===f.id, null, ()=>{ c.frag=f.id; redraw(); }))));
  }
  const note = h("textarea",{ placeholder:"Une idée précise ? (ex : le dragon en vert avec les yeux dorés)", value:c.note||"", oninput:e=>{ c.note = e.target.value; save(); } });
  card.append(h("label",{class:"fld", style:"margin-top:14px"}, h("span",{},"Ton idée en quelques mots (facultatif)"), note));

  // Aperçu + prix
  const pc = candleCost(c);
  card.append(h("div",{class:"result"},
    svgEl(candleSVG(c, 120, 150)),
    h("div",{},
      h("div",{class:"lbl"},"Ta bougie"),
      h("div",{style:"font-weight:800;font-size:1.05rem"}, sel ? sel.name : "Choisis un moule"),
      h("div",{class:"desc"}, describe(c)),
      h("div",{class:"lbl", style:"margin-top:10px"},"Prix du matériel"),
      h("div",{class:"price"}, sel ? money(pc.cost) : "—"),
      pc.grams ? h("div",{class:"desc"}, "≈ "+pc.grams+" g de cire") : null)));
  return card;
}
function demoColors(k){
  const pick = D.colors.slice(0,3).map(x=>x.id);
  if(k==="uni") return pick.slice(0,1);
  if(k==="pinceau") return pick.slice(0,2);
  return pick.length>=2 ? pick : pick.concat(pick);
}
function describe(c){
  const ST = STYLES[c.style]||STYLES.uni, names = (c.colors||[]).map(id=>cleanName((col(id)||{}).name)).filter(Boolean);
  let s;
  if(c.style==="pinceau") s = "Détails "+(names[0]||"?")+" au pinceau, fond "+(names[1]||"naturel");
  else if(!names.length) s = ST.name+" · cire naturelle";
  else s = ST.name+" · "+names.join(" + ");
  if(c.glitter) s += " · paillettes "+cleanName((col(c.glitter)||{}).name);
  if((c.pens||[]).length) s += " · stylo "+c.pens.map(id=>cleanName((col(id)||{}).name)).join(", ");
  const f = frag(c.frag); s += " · "+(f ? "parfum "+f.name : "sans parfum");
  return s;
}
function renderCandles(){
  const box = $("candles"); box.innerHTML = "";
  S.candles.forEach((c,i)=> box.append(renderCandle(c,i)));
  const max = D.maxCandles||2;
  $("candleSub").textContent = "Tu peux faire jusqu'à "+max+" bougie"+(max>1?"s":"")+". Le prix se met à jour en direct.";
  $("addCandle").style.display = S.candles.length < max ? "block" : "none";
}
function renderTotal(){
  const T = $("total"); T.innerHTML = "";
  let sum = 0, unknown = false;
  S.candles.forEach((c,i)=>{ const m = mold(c.mold); const pc = candleCost(c); if(m && pc.cost==null) unknown = true; if(pc.cost) sum += pc.cost;
    T.append(h("div",{class:"row"}, h("span",{}, "Bougie "+(i+1)+(m?" · "+m.name:"")), h("span",{}, m ? money(pc.cost) : "—"))); });
  if(+D.commonFee>0){ sum += +D.commonFee; T.append(h("div",{class:"row"}, h("span",{}, "Frais communs (mèches, stylos, emballage…)"), h("span",{}, money(+D.commonFee)))); }
  T.append(h("div",{class:"row", style:"border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:10px;align-items:baseline"}, h("span",{},"Total estimé"), h("span",{class:"big"}, money(sum)+(unknown?" +":""))));
  if(unknown) T.append(h("div",{style:"font-size:.78rem;color:#C9D3E6"},"+ le prix de certains moules sera confirmé le jour J."));
  renderSend();
}

/* ---------- Envoi des choix ---------- */
function problems(){
  const P = [];
  if(!(S.name||"").trim()) P.push("Indique ton prénom.");
  S.candles.forEach((c,i)=>{ if(!c.mold) P.push("Bougie "+(i+1)+" : choisis un moule."); const ST = STYLES[c.style]||STYLES.uni; if((c.colors||[]).length < ST.min) P.push("Bougie "+(i+1)+" : choisis "+ST.min+" couleurs pour la technique « "+ST.name+" »."); });
  return P;
}
function b64(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function code(){
  const o = { i:D.id, n:(S.name||"").trim(), e:(S.email||"").trim(), m:(S.comment||"").trim(), t:new Date().toISOString(),
              c:S.candles.map(c=>[c.mold, c.alt||"", c.style, c.colors, c.glitter||"", c.pens, c.frag||"", (c.note||"").trim()]) };
  return "BOUGIES1:"+b64(JSON.stringify(o));
}
function summary(){
  const L = ["Bonjour"+(D.host?" "+D.host:"")+",", "", "Voici mes choix pour « "+(D.title||"l'atelier bougies")+" »"+(D.date?" du "+fmtDate(D.date):"")+" :", ""];
  let sum = 0;
  S.candles.forEach((c,i)=>{ const m = mold(c.mold), a = mold(c.alt), pc = candleCost(c); if(pc.cost) sum += pc.cost;
    L.push("🕯️ Bougie "+(i+1)+" : "+(m?m.name:"?")+(a?" (sinon : "+a.name+")":"")+" — "+describe(c)+" — "+money(pc.cost));
    if(c.note) L.push("   Idée : "+c.note); });
  if(+D.commonFee>0) sum += +D.commonFee;
  L.push("", "Total estimé : "+money(sum));
  if((S.comment||"").trim()) L.push("", "Message : "+S.comment.trim());
  L.push("", "À bientôt,", (S.name||"").trim(), "", "---- CODE POUR L'APPLI (ne pas modifier) ----", code(), "----");
  return L.join("\n");
}
function renderSend(){
  const box = $("sendBox"); box.innerHTML = "";
  const P = problems();
  if(S.sent) box.append(h("div",{class:"ok"}, "✓ Choix envoyés le "+new Date(S.sent).toLocaleString("fr-FR",{dateStyle:"long", timeStyle:"short"})+". Tu peux encore les modifier et les renvoyer : la dernière version compte."));
  if(P.length){ box.append(h("div",{class:"warn"}, h("b",{},"Avant d'envoyer : "), h("ul",{style:"margin:4px 0 0;padding-left:18px"}, P.map(x=>h("li",{},x))))); }
  const subject = "Mes bougies — "+(D.title||"Atelier")+" — "+((S.name||"").trim()||"?");
  box.append(h("button",{ class:"btn gold", disabled:P.length>0, style:P.length?"opacity:.5":"", onclick:()=>{
    const url = "mailto:"+encodeURIComponent(D.hostEmail||"")+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(summary().replace(/\n/g,"\r\n"));
    S.sent = new Date().toISOString(); save(); renderSend();
    location.href = url;
  }}, "✉️ Envoyer mes choix par email"));
  box.append(h("button",{ class:"btn ghost", disabled:P.length>0, style:P.length?"opacity:.5":"", onclick:async ()=>{
    const t = summary();
    try{ if(navigator.share){ await navigator.share({ title:subject, text:t }); S.sent = new Date().toISOString(); save(); renderSend(); return; } }catch(e){ if(e && e.name==="AbortError") return; }
    try{ await navigator.clipboard.writeText(t); toast("Copié ! Colle-le dans un SMS ou WhatsApp à "+(D.host||"l'organisateur")); }
    catch(e){ window.prompt("Copie ce texte et envoie-le :", t); }
    S.sent = new Date().toISOString(); save(); renderSend();
  }}, "💬 Partager / copier (SMS, WhatsApp…)"));
  box.append(h("div",{class:"hint", style:"text-align:center"}, "L'email s'ouvre tout prêt"+(D.hostEmail?" pour "+D.hostEmail:"")+" : il ne reste qu'à appuyer sur Envoyer."));
}

function renderTechs(){
  const box = $("techs");
  const demo = demoColors("couches");
  baseStyles().forEach(k=>{
    box.append(h("div",{class:"tech"}, svgEl(candleSVG({ style:k, colors:k==="uni"?demo.slice(0,1):demo, mold:"" }, 96, 80)),
      h("div",{}, h("h4",{}, STYLES[k].name), h("p",{}, STYLES[k].long))));
  });
  Object.keys(ADDONS).filter(styleOn).forEach(k=>{
    const ex = k==="paillettes" ? { style:"uni", colors:demo.slice(0,1), glitter:(D.glitter[0]||{}).id||"x" } : { style:"uni", colors:[], pens:D.pens.slice(0,2).map(x=>x.id) };
    box.append(h("div",{class:"tech"}, svgEl(candleSVG(ex, 96, 80)), h("div",{}, h("h4",{}, ADDONS[k].name), h("p",{}, ADDONS[k].long))));
  });
}

stars(); head(); renderCandles(); renderTotal(); renderTechs();

<script>

const BUILTIN_TECH = [

/* Ton stock de départ (fragrances, copeaux, mica, paillettes, stylos) */
function seedMaterials(){

  const fragrances = [ F("Vanille",1), F("Rose",1), F("Ylang-ylang",1), F("Cherry blossom",1), F("Pomme",1), F("Jasmin",2) ];

  const colorants = [

function load(){
  try{
    const raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_V1);
    if(raw){ const s = JSON.parse(raw); return migrate(s); }
  }catch(e){}
  return defaults();
}
function migrate(s){
  const d = defaults();
  s.settings = Object.assign({}, d.settings, s.settings||{});
  ["waxes","molds","colorants","fragrances","techniques","projects","photos","timers"].forEach(k=>{ if(!Array.isArray(s[k])) s[k] = d[k]; });
  s.ui = Object.assign({}, d.ui, s.ui||{});
  if(!s.ui.open) s.ui.open = {};
  if(!(s.version>=2)){
    // v2 : ajoute ton stock sans créer de doublons (comparaison par nom)
    const mat = seedMaterials(), norm = x => (x||"").trim().toLowerCase();
    mat.fragrances.forEach(f=>{ const ex = s.fragrances.find(x=>norm(x.name)===norm(f.name)); if(ex){ if(ex.stock==null) ex.stock=f.stock; } else s.fragrances.push(f); });
    mat.colorants.forEach(c=>{ const ex = s.colorants.find(x=>norm(x.name)===norm(c.name)); if(ex){ if(ex.stock==null || ex.stock===""){ ex.stock=c.stock; ex.unit=c.unit; } if(!ex.notes) ex.notes=c.notes; } else s.colorants.push(c); });
    if(s.settings.flaconMl==null) s.settings.flaconMl = 10;
    if(s.settings.brushGrams===30) s.settings.brushGrams = 5;
    s.version = 2;
  }
  if(!(s.version>=3)){
    // v3 : page Prix (lots)
    if(!Array.isArray(s.lots) || !s.lots.length){
      const byType = t => s.colorants.filter(c=>c.type===t);
      s.lots = seedLots(s.waxes, { fragrances:s.fragrances, colorants:s.colorants });
      const fr = s.lots.find(l=>l.cat==="fragrance"); if(fr) fr.items = s.fragrances.map(f=>f.id);
      ["poudre","copeaux","paillettes","stylo"].forEach(t=>{ const l=s.lots.find(x=>x.cat===t); if(l) l.items = byType(t).map(c=>c.id); });
    }
    s.settings.uses = Object.assign({}, d.settings.uses, s.settings.uses||{});
    s.version = 3;
  }
  if(!Array.isArray(s.lots)) s.lots = [];
  if(!Array.isArray(s.coolHistory)) s.coolHistory = [];
  if(!Array.isArray(s.recipes)) s.recipes = [];
  if(!Array.isArray(s.reminders)) s.reminders = defaultReminders();
  if(!(s.version>=4)){
    // v4 : fragrances offertes / achats individuels
    const old = s.lots.find(l=>l.cat==="fragrance" && l.name==="Lot de fragrances" && l.price==null);
    if(old){ old.name = "Fragrances offertes avec l'appareil"; old.kind = "offert"; old.items = []; old.qty = null; old.notes = "Coche les 4 fragrances offertes."; }
    s.version = 4;
  }
  if(!(s.version>=5)){ applyKnownPrices(s); s.version = 5; }  // v5 : prix Amazon / AliExpress
  if(!(s.version>=6)){
    // v6 : mèches, copeaux et paillettes hors budget ; lavande et white tea épuisées
    s.lots = s.lots.filter(l=>!(["meche","copeaux","paillettes"].includes(l.cat) && l.price==null));
    s.fragrances.forEach(f=>{ if(["lavande","white tea"].includes((f.name||"").trim().toLowerCase()) && f.stock==null){ f.stock = 0; f.notes = f.notes || "Épuisée."; } });
    s.version = 6;
  }
  // v7 : fabrication de moules en silicone
  if(!s.silicone) s.silicone = defaultSilicone();
  s.silicone = Object.assign(defaultSilicone(), s.silicone);
  if(!Array.isArray(s.moldProjects)) s.moldProjects = [];
  if(!(s.version>=7)) s.version = 7;
  if(!(s.version>=8)){
    // v8 : kit silicone choisi (Amazon) + filament 25 €/kg
    const d8 = defaultSilicone(), si = s.silicone;

/* ---------- Photos (IndexedDB, repli localStorage) ---------- */
const PDB = {
  db:null, tried:false,
  open(){
    if(this.db || this.tried) return Promise.resolve(this.db);
    this.tried = true;
    return new Promise(res=>{
      try{
        const rq = indexedDB.open("atelier_bougies_v2_photos",1);
        rq.onupgradeneeded = ()=> rq.result.createObjectStore("p");
        rq.onsuccess = ()=>{ this.db = rq.result; res(this.db); };
        rq.onerror = ()=> res(null);
      }catch(e){ res(null); }
    });
  },
  async put(id,data){
    const db = await this.open();
    if(!db){ localStorage.setItem("bph2_"+id, data); return; }
    return new Promise((res,rej)=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").put(data,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  },
  async get(id){
    const db = await this.open();
    const own = !db ? localStorage.getItem("bph2_"+id) : await new Promise(res=>{ const rq=db.transaction("p").objectStore("p").get(id); rq.onsuccess=()=>res(rq.result||localStorage.getItem("bph2_"+id)); rq.onerror=()=>res(null); });
    return own || this.getV1(id);
  },
  v1:null,
  getV1(id){
    if(!this.v1) this.v1 = new Promise(res=>{ try{ const rq = indexedDB.open("atelier_bougies_photos"); rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>res(null); rq.onupgradeneeded = ()=>{ try{ rq.transaction.abort(); }catch(e){} }; }catch(e){ res(null); } });
    return this.v1.then(db=> new Promise(res=>{
      try{ if(!db || !db.objectStoreNames.contains("p")) return res(localStorage.getItem("bph_"+id)); const rq = db.transaction("p").objectStore("p").get(id); rq.onsuccess=()=>res(rq.result||localStorage.getItem("bph_"+id)); rq.onerror=()=>res(null); }
      catch(e){ res(localStorage.getItem("bph_"+id)); } }));
  },
  async del(id){
    localStorage.removeItem("bph2_"+id);
    const db = await this.open();
    if(!db) return;
    return new Promise(res=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
  }
};

function compressImage(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1200; const s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.75));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  let late = null;
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k==="style") el.style.cssText = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="value" && tag==="select") late = v;
    else if(k==="value" || k==="checked" || k==="disabled") el[k] = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  kids.flat(9).forEach(c=>{ if(c==null || c===false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  if(late!=null) el.value = late;
  return el;
}
function field(label, input){ return h("label",{class:"fld"}, h("span",{},label), input); }
function inp(obj, prop, o){
  o = o||{};
  const num = o.type==="number";
  return h("input",{ type:o.type||"text", value: obj[prop]==null ? "" : obj[prop], placeholder:o.ph||"", step:o.step, min:o.min, max:o.max,
    inputmode: num ? "decimal" : null, class:o.cls,
    oninput:e=>{ obj[prop] = num ? (e.target.value==="" ? null : +String(e.target.value).replace(",",".")) : e.target.value; save(); if(o.live) o.live(); },
    onchange:o.onchange });
}
function area(obj, prop, ph){ return h("textarea",{ placeholder:ph||"", value:obj[prop]||"", oninput:e=>{ obj[prop]=e.target.value; save(); } }); }
function sel(obj, prop, options, onchange){
  return h("select",{ value: obj[prop]==null ? "" : obj[prop], onchange:e=>{ obj[prop] = e.target.value===""?null:e.target.value; save(); if(onchange) onchange(); } },
    options.map(o=>h("option",{value:o[0]}, o[1])));
}

function fracLabel(x){
  if(!(x>0)) return "—";
  const whole = Math.floor(x), r = x-whole;
  const C = [[0,""],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,""]];
  let best = C[0], bd = 9;
  C.forEach(c=>{ const d=Math.abs(r-c[0]); if(d<bd){ bd=d; best=c; } });
  const w = whole + (best[0]===1 ? 1 : 0);
  const f = best[0]===1 ? "" : best[1];
  let s;
  if(w===0 && !f) s = "un fond de flacon";
  else s = (w ? w+(f?" "+f:"") : f) + " flacon" + (w>1 || (w===1&&f) ? "s" : "");
  const ml = state.settings.flaconMl ? " (≈ "+num(x*state.settings.flaconMl,1)+" ml)" : "";
  return "≈ "+s+ml;
}
function tspLabel(t){
  const q = Math.round(t*4)/4;
  if(q<=0) return "une pointe de cuillère";
  const w = Math.floor(q), r = q-w;
  const fr = {0:"",0.25:"¼",0.5:"½",0.75:"¾"}[r];
  return (w ? w+(fr?" "+fr:"") : fr) + " c. à café";
}
function colorDose(c, g){

}

/* =========================================================
   CALCUL DU PLAN (fontes, couches, lots)
   ========================================================= */
function itemParts(item, mold){
  const w = +mold.weight || 0;
  const L = (item.layers||[]).map(l=>Object.assign({}, l, { t:getTech(l.tech) })).filter(x=>x.t);
  let used = 0;
  L.forEach(x=>{ if(x.t.behavior==="portion" || x.t.behavior==="finish"){ x.g = w*(+x.pct||0)/100; used += x.g; } });
  let mains = L.filter(x=>x.t.behavior==="main");
  if(!mains.length && used < w-0.01){
    const m = { id:"auto", tech:"coulee", colors:[], t:getTech("coulee"), auto:true };
    L.push(m); mains = [m];
  }
  const rest = Math.max(0, w-used);
  mains.forEach(x=> x.g = rest/mains.length);
  let bi=0, pi=0;
  L.forEach(x=>{
    const b = x.t.behavior;
    if(b==="brush"){ x.g=0; bi++; x.stage="B"+bi; x.rank=bi; }
    else if(b==="portion"){ pi++; x.stage="P"+pi; x.rank=100+pi; }
    else if(b==="main"){ x.stage="M"; x.rank=200; }
    else if(b==="post"){ x.g=0; x.stage="D"; x.rank=400; }
    else { x.stage="F"; x.rank=300; }
  });
  return { L, over: used > w+0.01 && w>0 };
}
function stageTitleLot(x){
  if(x.stage[0]==="B") return "Pinceau — passage "+x.stage.slice(1);
  if(x.stage[0]==="P") return "Couche "+x.stage.slice(1);
  if(x.stage==="M") return "Coulée principale";
  return "Couche de finition";
}
function computePlan(p){
  const S = state.settings, m = (+S.margin||0)/100, cap = +S.capacity||700, binCap = cap/(1+m);
  const stages = {}, warnings = [], decos = [];
  (p.items||[]).forEach((it,ii)=>{
    const mold = getMold(it.moldId);
    if(!mold){ warnings.push("Un moule de ce projet a été supprimé de la bibliothèque."); return; }
    const qty = +it.qty || 1;
    if(!(+mold.weight>0)) warnings.push("Poids inconnu pour « "+mold.name+" » : remplis le moule d'eau et note les ml dans la Bibliothèque (1 ml = 1 g de cire).");
    if(mold.copies!=null && +mold.copies>0 && qty > +mold.copies) warnings.push(mold.name+" : "+qty+" demandé(s) mais tu en as "+mold.copies+" → il faudra démouler et recouler.");
    const { L, over } = itemParts(it, mold);
    if(over) warnings.push(mold.name+" : les couches en % dépassent 100 % du moule.");
    L.forEach(x=>{
      if(x.t.behavior==="post"){ decos.push({ item:it, mold, qty, colors:x.colors||[], zone:x.zone||"", instr:x.t.instr||"", techName:x.t.name }); return; }
      const isMoule = p.mode==="moule";
      const key = isMoule ? it.id+"_"+x.stage : x.stage;
      const order = isMoule ? ii*1000 + x.rank : x.rank;
      const title = isMoule ? mold.name+(qty>1?" ×"+qty:"")+" — "+x.t.name : stageTitleLot(x);
      if(!stages[key]) stages[key] = { key, order, title, behavior:x.t.behavior, itemId:it.id, entries:[] };
      const isMarb = x.t.id==="marbre" && (x.colors||[]).length>1;
      const groups = isMarb ? x.colors.map(c=>[c]) : [x.colors||[]];
      groups.forEach(cg=> stages[key].entries.push({
        item:it, mold, qty, g:x.g/groups.length, colors:cg,
        frag: x.t.behavior==="brush" ? null : (it.fragId||null),
        zone:x.zone||"", techName:x.t.name, instr:x.t.instr||"", marb:isMarb
      }));
    });
  });
  const list = Object.values(stages).sort((a,b)=>a.order-b.order);
  list.forEach(st=>{
    const bmap = {};
    st.entries.forEach(e=>{
      const k = (st.behavior==="brush"?"b":"c")+"|"+e.colors.slice().sort().join(",")+"|"+(e.frag||"");
      (bmap[k] = bmap[k] || { colors:e.colors, frag:e.frag, brush:st.behavior==="brush", entries:[] }).entries.push(e);
    });
    st.batches = Object.values(bmap);
    st.marb = st.entries.some(e=>e.marb);
    st.batches.forEach(b=>{
      if(b.brush){
        const nb = b.entries.reduce((s,e)=>s+e.qty,0);
        const net = nb*(+S.brushGrams||5);
        b.fontes = [{ net, grams:Math.ceil(net*(1+m)), units:[] }];
        return;
      }
      const units = [];
      b.entries.forEach(e=>{ for(let q=0;q<e.qty;q++) units.push({ e, g:e.g }); });
      const bins = []; let cur = null;
      units.forEach(u=>{
        if(!cur || (cur.sum+u.g > binCap && cur.units.length)){ cur = { sum:0, units:[] }; bins.push(cur); }
        cur.units.push(u); cur.sum += u.g;
      });
      b.fontes = bins.map(bn=>({ net:bn.sum, grams:Math.ceil(bn.sum*(1+m)), units:bn.units }));
      b.fontes.forEach(f=>{ if(f.grams>cap) warnings.push("Une fonte dépasse la capacité de l'appareil ("+f.grams+" g > "+cap+" g) : un seul moule est plus lourd que l'appareil."); });
    });
  });
  // Totaux
  let wax=0, net=0, fontes=0; const frag={}, cols=new Set();
  list.forEach(st=>st.batches.forEach(b=>{
    b.colors.forEach(c=>cols.add(c));
    b.fontes.forEach(f=>{ wax+=f.grams; net+=f.net; fontes++; if(b.frag) frag[b.frag]=(frag[b.frag]||0)+f.grams/(+S.fragRef||700); });
  }));
  return { stages:list, decos, warnings:[...new Set(warnings)], totals:{ wax, net, fontes, frag, cols:[...cols] } };
}

function whoNames(p, items){
  const P = (p && p.participants) || [], out = [];
  items.forEach(it=>{ const q = P.find(x=>x.id===it.who); const n = q ? q.name : (P.length ? "groupe" : ""); if(n && !out.includes(n)) out.push(n); });
  return out;
}
function pourList(units, p){
  const g = new Map();
  units.forEach(u=>{
    const k = u.e.item.id+"|"+u.e.g;
    if(!g.has(k)) g.set(k,{ e:u.e, n:0 });
    g.get(k).n++;
  });
  return [...g.values()].map(x=>{
    const name = x.e.mold.name + (x.e.marb ? " (marbré)" : "");
    const each = Math.round(x.e.g), who = whoNames(p, [x.e.item])[0];
    return name+" ×"+x.n+" ("+(x.n>1 ? x.n+" × " : "")+each+" g)"+(who ? " → "+who : "");
  }).join(", ");
}

/* =========================================================
   GÉNÉRATION DE LA CHECK-LIST
   ========================================================= */
function buildChecklist(p){
  const plan = computePlan(p), S = state.settings, wax = getWax(p.waxId);
  const sections = [];
  // Préparation
  const prep = [];
  const moldNames = (p.items||[]).map(it=>{ const m=getMold(it.moldId); return m ? m.name+(it.qty>1?" ×"+it.qty:"") : null; }).filter(Boolean);
  prep.push({ key:"prep_molds", text:"Sortir et nettoyer les moules et pots : "+moldNames.join(", ") });
  // Mèches : toujours ficelle en silicone ; ficelle ou bois pour les pots
  const wickGroups = { sil:[], ficelle:[], bois:[] }, wickCount = { sil:0, ficelle:0, bois:0 };
  (p.items||[]).forEach(it=>{
    const m = getMold(it.moldId); if(!m) return;
    const n = (+it.qty||1) * (+m.cavities||1);
    const g = m.kind==="verre" ? wickOf(it,m) : "sil";
    wickGroups[g].push(m.name+" ("+n+" mèche"+(n>1?"s":"")+")"); wickCount[g] += n;
  });
  const wickSteps = [];
  if(wickGroups.sil.length) wickSteps.push({ key:"prep_wick_sil", par:true, text:"Pendant la fonte : passer la grosse aiguille avec la mèche ficelle dans les moules silicone — "+wickCount.sil+" mèche(s) : "+wickGroups.sil.join(", ") });
  if(wickGroups.ficelle.length) wickSteps.push({ key:"prep_wick_fic", par:true, text:"Pendant la fonte : fixer une mèche ficelle au fond des pots en verre — "+wickCount.ficelle+" mèche(s) : "+wickGroups.ficelle.join(", "), note:"Centrer la mèche et la maintenir droite (pince ou bâtonnet)." });
  if(wickGroups.bois.length) wickSteps.push({ key:"prep_wick_bois", par:true, text:"Pendant la fonte : fixer une mèche bois au fond des pots en verre — "+wickCount.bois+" mèche(s) : "+wickGroups.bois.join(", "), note:"Centrer la mèche et la maintenir droite." });
  prep.push({ key:"prep_wax", text:"Sortir "+num(plan.totals.wax)+" g de "+wax.name+" au total (marge de "+num(S.margin,1)+" % incluse) — "+plan.totals.fontes+" fonte(s)" });
  plan.warnings.forEach((w,i)=> prep.unshift({ key:"warn_"+i, text:"⚠ "+w, info:true }));
  plan.totals.cols.forEach(cid=>{ const c=getCol(cid); if(c) prep.push({ key:"prep_c_"+cid, text:"Préparer : "+c.name }); });
  Object.entries(plan.totals.frag).forEach(([fid,x])=>{ const f=getFrag(fid); prep.push({ key:"prep_f_"+fid, text:"Préparer la fragrance "+(f?f.name:"?")+" — "+fracLabel(x)+" au total" }); });
  prep.push({ key:"prep_tools", text:"Thermomètre, balance, pinceaux, pique, cuillères et récipient silicone propre"+(S.pitchers>1?" (×"+S.pitchers+")":"") });
  sections.push({ id:"prep", title:"Préparation", steps:prep });

  let fonteNo = 0;
  const fontes = [], timeline = [];   // pour le suivi de température et le planning
  plan.stages.forEach((st,si)=>{
    const steps = [];
    if(st.marb) steps.push({ key:st.key+"_marb", text:"Marbré : pendant que la 1re couleur refroidit dans le récipient, garde la 2e dans l'appareil. Coule-les en alternance puis tourne avec une pique.", info:true });
    const flat = [];
    st.batches.forEach(b=>b.fontes.forEach(f=>flat.push({ b, f, pre:false })));
    let prevColKey = null;
    flat.forEach((x,fi)=>{
      fonteNo++;
      const n = fonteNo, b = x.b, f = x.f, K = st.key+"_"+fi+"_";
      const colKey = b.colors.slice().sort().join(",");
      const fr = b.frag ? getFrag(b.frag) : null;
      const startIdx = steps.length;
      steps.push({ sub:true, text:"Fonte n°"+n+" · "+(colorNames(b.colors)||"naturel (sans colorant)")+(fr?" · "+fr.name:"")+" · "+(f.grams?f.grams:"?")+" g"+(b.brush?" (petite quantité)":"") });
      if(x.pre) steps.push({ key:K+"v", text:"Fonte n°"+n+" déjà lancée en parallèle : attendre la fonte complète", temp:wax.melt });
      else {
        steps.push({ key:K+"p", text:"Peser "+(f.grams||"?")+" g de "+wax.name });
        steps.push({ key:K+"m", text:"Faire fondre dans l'appareil jusqu'à la fonte complète", temp:wax.melt });
      }
      if(fi>0 && (+S.pitchers||1)<=1 && prevColKey!==colKey) steps.push({ key:K+"w", text:"Vider et essuyer le récipient silicone (changement de couleur)" });
      steps.push({ key:K+"t", text:"Verser la cire fondue de l'appareil dans le récipient silicone"+((+S.pitchers||1)>1 ? " n°"+((fi%S.pitchers)+1) : "") });
      const nx = flat[fi+1];
      if(nx){ nx.pre = true; steps.push({ key:K+"n", par:true, text:"En parallèle : peser "+(nx.f.grams||"?")+" g de "+wax.name+" et lancer la fonte n°"+(n+1)+" dans l'appareil" }); }
      const ts = [];
      b.colors.map(getCol).filter(c=>c && c.type!=="paillettes").forEach(c=>{
        ts.push({ t:+wax.color, o:0, key:K+"c_"+c.id, text:"Ajouter "+c.name+" — "+colorDose(c,f.grams)+", bien mélanger" });
      });
      if(b.frag) ts.push({ t:+wax.frag, o:1, key:K+"f", text:"Ajouter la fragrance "+(fr?fr.name:"?")+" — "+fracLabel(f.grams/(+S.fragRef||700))+", mélanger doucement "+S.stir+" min" });
      ts.sort((a,c)=> c.t-a.t || a.o-c.o).forEach(s=>steps.push({ key:s.key, text:s.text, temp:s.t }));
      const gl = b.colors.map(getCol).filter(c=>c && c.type==="paillettes");
      if(gl.length) steps.push({ key:K+"g", text:"Juste avant de "+(b.brush?"peindre":"couler")+" : ajouter "+gl.map(c=>c.name).join(" + ")+" (1 pincée, au visuel) et mélanger" });
      if(b.brush){
        const targets = b.entries.map(e=>{ const w = whoNames(p,[e.item])[0]; return e.mold.name+(e.qty>1?" ×"+e.qty:"")+(e.zone?" → "+e.zone:"")+(w?" ("+w+")":""); }).join(", ");
        const instr = [...new Set(b.entries.map(e=>e.instr).filter(Boolean))].join(" ");
        steps.push({ key:K+"x", text:"Peindre au pinceau : "+targets, temp:+wax.pour, note:instr });
      } else {
        let instr = [...new Set(b.entries.map(e=>e.instr).filter(Boolean))].join(" ");
        const hasPowder = b.colors.map(getCol).some(c=>c && (c.type==="poudre" || c.type==="paillettes"));
        if(hasPowder && f.units.some(u=>u.e.mold.kind==="verre")) instr += (instr?" ":"")+"⚠ Mica/paillettes dans un pot : risque d'encrasser la mèche, bien remuer avant de couler.";
        steps.push({ key:K+"x", text:"Couler : "+pourList(f.units, p), temp:+wax.pour, note:instr });
      }
      // Fiche de la fonte : étapes concernées + températures cibles (colorant, parfum, coulée)
      const targets = [];
      ts.forEach(s=>targets.push({ t:s.t, key:s.key, label: s.o===0 ? "colorant" : "parfum" }));
      targets.push({ t:+wax.pour, key:K+"x", label: b.brush ? "pinceau" : "coulée" });
      const fo = { fk:K, n, grams:+f.grams||0, brush:b.brush, targets, label:"Fonte n°"+n };
      fontes.push(fo);
      const forWho = whoNames(p, b.brush ? b.entries.map(e=>e.item) : f.units.map(u=>u.e.item));
      fo.who = forWho;
      steps.slice(startIdx).forEach(s=>{ if(!s.par){ s.fk = K; s.who = forWho; } });
      timeline.push({ type:"fonte", fk:K, n, grams:+f.grams||0, brush:b.brush, stage:si, colorChange: fi>0 && prevColKey!==colKey,
                      units: b.brush ? b.entries.reduce((s,e)=>s+e.qty,0) : f.units.length });
      prevColKey = colKey;
    });
    const next = plan.stages[si+1];
    const needWait = next && (p.mode!=="moule" || next.itemId===st.itemId);
    if(needWait){
      const min = st.behavior==="brush" ? S.waitBrush : st.behavior==="portion" ? S.waitLayer : S.waitFinish;
      steps.push({ key:st.key+"_wait", text:"Laisser durcir avant l'étape suivante", timer:+min||15 });
      timeline.push({ type:"wait", min:+min||15, stage:si });
    }
    sections.push({ id:st.key, title:(si+1)+". "+st.title, steps });
  });
  // Mèches : insérées pendant la toute première fonte
  if(wickSteps.length){
    const first = sections[1];
    const idx = first ? first.steps.findIndex(s=>s.key && /_m$/.test(s.key)) : -1;
    if(idx>=0) first.steps.splice(idx+1, 0, ...wickSteps);
    else prep.push(...wickSteps.map(s=>Object.assign({}, s, { par:false, text:s.text.replace("Pendant la fonte : ","") })));
  }
  sections.push({ id:"demoulage", title:"Démoulage", steps:[
    { key:"fin_cool", text:"Laisser refroidir complètement avant de démouler (plusieurs heures)" },
    { key:"fin_demoule", text:"Démouler, retirer l'aiguille et couper les mèches" }
  ]});
  // Décoration aux stylos (après démoulage)
  if(plan.decos.length){
    const pens = [...new Set(plan.decos.flatMap(d=>d.colors))];
    const ds = [{ key:"deco_prep", text:"Préparer les stylos : "+(pens.length ? colorNames(pens) : "couleurs à choisir") }];
    plan.decos.forEach((d,i)=> ds.push({ key:"deco_"+d.item.id+"_"+i,
      text:"Décorer "+d.mold.name+(d.qty>1?" ×"+d.qty:"")+" au stylo "+(colorNames(d.colors)||"?")+(d.zone?" → "+d.zone:""), note:d.instr }));
    ds.push({ key:"deco_dry", text:"Laisser sécher la décoration" });
    sections.push({ id:"deco", title:"Décoration aux stylos", steps:ds });
  }
  sections.push({ id:"fin", title:"Fin", steps:[
    { key:"fin_photo", text:"Prendre des photos et les ajouter au projet 📷" },
    { key:"fin_note", text:"Noter le résultat et les remarques dans le projet" }
  ]});
  return { sections, plan, fontes, timeline };
}

/* =========================================================
   MINUTEURS + ÉCRAN ALLUMÉ
   ========================================================= */
function startTimer(label, minutes){
  state.timers.push({ id:uid(), label, end:Date.now()+minutes*60000, fired:false });
  saveNow(); renderTimers(); toast("Minuteur lancé : "+minutes+" min");
  try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){}
}
let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+t+0.3);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.3);
    });
  }catch(e){}
}
function renderTimers(){
  const bar = document.getElementById("timerBar");
  bar.innerHTML = "";
  state.timers.forEach(t=>{
    const left = Math.max(0, t.end-Date.now());
    const mm = Math.floor(left/60000), ss = Math.floor(left%60000/1000);
    bar.append(h("div",{class:"tmr"+(t.fired?" fired":"")},
      h("span",{class:"clock"}, t.fired ? "⏰ 0:00" : mm+":"+String(ss).padStart(2,"0")),
      h("span",{class:"lab"}, t.fired ? "Terminé — "+t.label : t.label),
      t.fired ? null : h("button",{onclick:()=>{ t.end += 5*60000; saveNow(); renderTimers(); }},"+5"),
      h("button",{onclick:()=>{ state.timers = state.timers.filter(x=>x!==t); saveNow(); renderTimers(); }},"✕")
    ));
  });
}
setInterval(()=>{
  if(!state.timers.length) return;
  let changed = false;
  state.timers.forEach(t=>{
    if(!t.fired && Date.now()>=t.end){
      t.fired = true; changed = true;
      beep(); try{ navigator.vibrate && navigator.vibrate([400,200,400,200,400]); }catch(e){}
      toast("⏰ "+t.label+" : c'est prêt !");
      try{ if("Notification" in window && Notification.permission==="granted") new Notification("Atelier Bougies",{ body:t.label+" : c'est prêt !" }); }catch(e){}
    }
  });
  if(changed) saveNow();
  renderTimers();
}, 1000);

let wakeLock = null, wantWake = false;
async function toggleWake(){
  wantWake = !wantWake;
  if(wantWake){ await acquireWake(); }
  else { try{ wakeLock && await wakeLock.release(); }catch(e){} wakeLock = null; }
  rerender();
}
async function acquireWake(){
  try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); toast("Écran maintenu allumé"); } else { toast("Non disponible sur ce navigateur"); wantWake=false; } }
  catch(e){ toast("Impossible de garder l'écran allumé"); wantWake=false; }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && wantWake) acquireWake(); });
