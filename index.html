const app = document.getElementById("app");
function setHeader(t, s){ document.getElementById("hTitle").textContent=t; document.getElementById("hSub").textContent=s||""; }
function go(tab){ state.ui.tab = tab; if(tab!=="projets") {} save(); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.bottom button").forEach(b=> b.addEventListener("click", ()=>{
  if(b.dataset.tab==="projets") state.ui.editing = null;
  if(b.dataset.tab==="silicone") state.ui.moldEditing = null;
  if(b.dataset.tab==="prep") state.ui.inviteEditing = null;
  go(b.dataset.tab);
}));
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0,y); }
function render(){
  document.querySelectorAll("nav.bottom button").forEach(b=> b.classList.toggle("on", b.dataset.tab===state.ui.tab));
  app.innerHTML = "";
  const t = state.ui.tab;
  if(t==="projets") state.ui.editing ? renderProject() : renderProjects();
  else if(t==="checklist") renderChecklist();
  else if(t==="biblio") renderLibrary();
  else if(t==="silicone") state.ui.moldEditing ? renderMoldProject() : renderSilicone();
  else if(t==="prep") renderPrep();
  else renderSettings();
  renderTimers();
}

              ideas:"", items:[], result:"", checks:{}, extra:{}, open:{}, deducted:false };

/* ---------- RECETTES : une réalisation complète (moule + couleurs + techniques), parfum au choix ---------- */
function recipeLabel(layers){
  return (layers||[]).map(l=>{ const t = getTech(l.tech); return (t?t.name.replace(/\s*\(.*\)/,""):"?")+(l.colors&&l.colors.length?" "+colorNames(l.colors):" naturel")+(l.zone?" ("+l.zone+")":""); }).join(" → ") || "Coulée simple, naturel";
}
function saveRecipe(it){
  const m = getMold(it.moldId);
  const existing = it.recipeId && (state.recipes||[]).find(r=>r.id===it.recipeId);
  const def = existing ? existing.name : (m?m.name:"Recette")+((it.layers||[]).length ? " "+[...new Set((it.layers||[]).flatMap(l=>l.colors||[]))].map(id=>{ const c=getCol(id); return c?c.name.replace(/^(Mica|Copeaux|Paillettes|Stylo)\s+/i,""):""; }).filter(Boolean).join(" et ") : "");
  const name = prompt(existing ? "Mettre à jour la recette :" : "Nom de la recette :", def);
  if(!name) return;
  const data = { name:name.trim(), moldId:it.moldId, qty:+it.qty||1, notes:it.notes||"",
                 layers:(it.layers||[]).map(l=>({ tech:l.tech, colors:(l.colors||[]).slice(), zone:l.zone||"", pct:l.pct==null?null:+l.pct })) };
  if(existing) Object.assign(existing, data, { updated:today() });
  else { const r = Object.assign({ id:"rc_"+uid(), date:today() }, data); state.recipes.push(r); it.recipeId = r.id; }
  saveNow(); rerender(); toast(existing ? "Recette mise à jour" : "Recette enregistrée ⭐");
}
function addFromRecipe(p, rid){
  const r = state.recipes.find(x=>x.id===rid); if(!r) return;
  if(!getMold(r.moldId)){ toast("⚠ Le moule de cette recette n'existe plus"); return; }
  p.items.push({ id:uid(), moldId:r.moldId, qty:r.qty||1, fragId:null, notes:r.notes||"", recipeId:r.id,
                 layers:r.layers.map(l=>Object.assign({ id:uid() }, JSON.parse(JSON.stringify(l)))) });
  saveNow(); rerender(); toast("« "+r.name+" » ajoutée — choisis le parfum");
}

  app.append(h("div",{class:"muted small", style:"margin-bottom:10px"},"Tes réalisations préférées : moule, couleurs et techniques. Le parfum se choisit à chaque projet. Pour en créer une : dans un projet, bouton « ⭐ Enregistrer comme recette » sous un moule."));
  if(!state.recipes.length){ app.append(h("div",{class:"card empty"}, h("span",{class:"ic"},"⭐"), "Aucune recette pour l'instant.")); return; }
  state.recipes.slice().sort((a,b)=>a.name.localeCompare(b.name,"fr")).forEach(r=>{
    const m = getMold(r.moldId);

    const thumb = ph ? h("img",{class:"thumb", alt:"", style:"width:44px;height:44px"}) : h("div",{class:"thumb", style:"width:44px;height:44px;font-size:1.2rem"},"⭐");
    if(ph) photoSrc(ph.id).then(s=>{ if(s) thumb.src = s; });

    app.append(libItem(r.id,
      [thumb, h("span",{class:"n"}, r.name), h("span",{class:"v"}, used ? used+"×" : "")],
      [
        field("Nom", inp(r,"name")),
        h("div",{class:"muted", style:"margin-bottom:6px"}, "🕯️ "+(m ? m.name+(r.qty>1?" ×"+r.qty:"") : "moule supprimé")),
        h("div",{style:"margin-bottom:8px"}, (r.layers||[]).length ? r.layers.map((l,i)=>h("div",{class:"layer", style:"margin:4px 0"},
          h("div",{class:"row"}, h("span",{class:"num"}, i+1), h("span",{class:"grow", style:"font-size:.86rem"}, (getTech(l.tech)||{name:"?"}).name+(l.pct?" ("+l.pct+" %)":"")+(l.zone?" — "+l.zone:""))),
          h("div",{style:"margin-top:4px"}, (l.colors||[]).length ? l.colors.map(cid=>{ const c=getCol(cid); return h("span",{class:"cchip", style:"padding-right:8px"}, h("span",{class:"dot", style:"background:"+(c?c.color:"#ccc")}), c?c.name:"?"); }) : h("span",{class:"muted small"},"naturel")))) : h("div",{class:"muted small"},"Coulée simple, naturel")),
        field("Notes", area(r,"notes","")),
        h("div",{class:"muted small"}, "Créée le "+fmtDateShort(r.date)+(used?" · utilisée dans "+used+" projet(s)":"")),

/* ---------- RAPPELS (check-list en haut de l'accueil) ---------- */
function renderReminders(){
  const R = state.reminders = state.reminders||[];
  const todo = R.filter(r=>!r.done), done = R.filter(r=>r.done);
  const card = h("div",{class:"card", style:"border-left:4px solid var(--amber)"});
  card.append(h("div",{class:"row", style:"margin-bottom:6px"}, h("h2",{class:"grow", style:"margin:0"},"📌 Rappels"+(todo.length?" ("+todo.length+")":"")),
    done.length ? h("button",{class:"btn ghost sm", onclick:()=>{ state.ui.showDone = !state.ui.showDone; save(); rerender(); }}, state.ui.showDone ? "Masquer faits" : "Voir faits ("+done.length+")") : null));
  if(!todo.length) card.append(h("div",{class:"muted small"},"Rien à faire pour l'instant 👍"));
  todo.concat(state.ui.showDone ? done : []).forEach(r=>{
    const cb = h("input",{ type:"checkbox", checked:r.done, onchange:()=>{ r.done = cb.checked; r.doneDate = cb.checked ? today() : null; saveNow(); rerender(); } });
    card.append(h("div",{class:"step"+(r.done?" done":"")}, cb,
      h("label",{class:"txt", onclick:()=>{ cb.checked=!cb.checked; cb.dispatchEvent(new Event("change")); }}, r.text),
      h("button",{class:"xbtn", onclick:()=>{ if(confirm("Supprimer ce rappel ?")){ state.reminders = R.filter(x=>x!==r); saveNow(); rerender(); } }},"✕")));
  });
  const ai = h("input",{ placeholder:"Nouveau rappel…" });
  const add = ()=>{ const v = ai.value.trim(); if(!v) return; R.push({ id:"rm_"+uid(), text:v, done:false, date:today() }); saveNow(); rerender(); };
  ai.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
  card.append(h("div",{class:"add-row", style:"padding:8px 0 0"}, ai, h("button",{class:"btn sm", onclick:add},"Ajouter")));
  return card;
}

    app.append(h("div",{class:"card pcard", onclick:()=>{ state.ui.editing=p.id; save(); render(); window.scrollTo(0,0); }},
      thumb,
      h("div",{class:"grow"},
        h("div",{class:"row"}, h("span",{class:"t grow"}, p.title||"Projet sans titre"), h("span",{class:"tag "+p.status}, statusLabel(p.status))),
        h("div",{class:"d"}, fmtDate(p.date)),
        h("div",{class:"muted small"}, molds || (p.ideas ? p.ideas.slice(0,90) : "Aucun moule"))
      )
    ));
  });

/* ---------- PROJET : édition ---------- */
function renderProject(){

/* ---------- BUDGET DE LA JOURNÉE ---------- */
function lotPrice(l){ return l.kind==="offert" ? 0 : (l.price==null || l.price==="" ? null : +l.price); }
function lotFor(pred){ const l = state.lots.filter(x=>lotPrice(x)!=null && pred(x)); return l.length ? l[l.length-1] : null; }  // le lot le plus récent
/* Prix d'un article = moyenne de ses achats (ex : un jasmin offert + un jasmin acheté 4 € → 2 € le flacon) */
function unitPrice(itemId){
  const prices = state.lots.filter(l=>(l.items||[]).includes(itemId) && lotPrice(l)!=null).map(l=> l.kind==="unite" ? lotPrice(l) : lotPrice(l)/lotUnits(l));
  return prices.length ? prices.reduce((s,x)=>s+x,0)/prices.length : null;
}
function lotUnits(l){ return +l.qty>0 ? +l.qty : Math.max(1,(l.items||[]).length); }
function waxPerKg(waxId){
  const lot = lotFor(l=>l.cat==="cire" && l.waxId===waxId && +l.qty>0);
  return lot ? lotPrice(lot)/(+lot.qty) : null;
}
function wickPrice(type){
  const lot = lotFor(l=>l.cat==="meche" && (l.wickType||"ficelle")===type && +l.qty>0);
  return lot ? lotPrice(lot)/(+lot.qty) : null;
}
function penLotOn(p){
  if(p.penLot===true || p.penLot===false) return p.penLot;
  return (+p.people||1) >= (+state.settings.penLotMinPeople||5);
}
function projectCost(p, plan){
  plan = plan || computePlan(p);
  const S = state.settings, lines = [];
  const add = (label, amount, detail) => lines.push({ label, amount, detail });
  // Cire
  const wax = getWax(p.waxId), kg = waxPerKg(wax.id);
  if(plan.totals.wax>0) add(wax.name, kg==null ? null : plan.totals.wax/1000*kg, num(plan.totals.wax)+" g"+(kg!=null?" × "+money(kg)+"/kg":""));
  // Fragrances
  Object.entries(plan.totals.frag).forEach(([fid,x])=>{ const f=getFrag(fid), u=unitPrice(fid); add("Fragrance "+(f?f.name:"?"), u==null?null:x*u, fracLabel(x).replace("≈ ","")); });
  // Mica : au prorata des cuillères utilisées (1 pot ≈ S.micaTspPerPot cuillères)
  const tsp = {};
  plan.stages.forEach(st=>st.batches.forEach(b=>b.fontes.forEach(f=>b.colors.forEach(cid=>{
    const c = getCol(cid); if(c && c.type==="poudre") tsp[cid] = (tsp[cid]||0) + f.grams/100*(+S.micaPer100||1);
  }))));
  Object.entries(tsp).forEach(([cid,t])=>{
    const c = getCol(cid), u = unitPrice(cid), per = +S.micaTspPerPot||15;
    add(c.name, u==null ? null : t/per*u, "≈ "+tspLabel(t)+" (1 pot ≈ "+per+" c. à café)");
  });
  // Stylos : prix du stylo ÷ nombre de bougies décorées avec un stylo
  const candles = {};
  (p.items||[]).forEach(it=>{
    const m = getMold(it.moldId); if(!m) return;
    const n = (+it.qty||1)*(+m.cavities||1);
    new Set((it.layers||[]).flatMap(l=>l.colors||[])).forEach(cid=>{ candles[cid]=(candles[cid]||0)+n; });
  });
  Object.entries(candles).forEach(([cid,n])=>{
    const c = getCol(cid); if(!c || c.type==="poudre") return;
    if(c.type==="copeaux" || c.type==="paillettes" || c.type==="stylo"){ lines.push({ label:c.name, amount:0, detail: c.type==="stylo" ? "non compté au stylo près" : "non compté dans le budget", ignored:true }); return; }
    const u = unitPrice(cid), uses = +(S.uses||{})[c.type];
    add(c.name, u==null || !uses ? null : u/uses*n, n+" bougie"+(n>1?"s":"")+(uses?" (1 "+(c.unit||"unité")+" ≈ "+uses+" bougies)":" — usage à régler dans Prix"));
  });
  // Journée de groupe : un lot de stylos entier est compté (auto à partir de S.penLotMinPeople personnes)
  if(penLotOn(p)) lines.push({ label:"Lot de stylos (journée de groupe)", amount:+S.penLotPrice||0, detail:"compté car "+(p.penLot===true?"coché":"plus de "+((+S.penLotMinPeople||5)-1)+" personnes"), penLot:true });
  // Mèches : comprises, non comptées
  // Moules silicone fabriqués pendant l'atelier
  (p.moldProjects||[]).forEach(id=>{
    const mp = state.moldProjects.find(x=>x.id===id); if(!mp) return;
    const c = moldProjectCalc(mp);
    add("Moule silicone « "+(mp.name||"sans nom")+" »", c.total>0 ? c.cost : null, c.total>0 ? "≈ "+num(c.total)+" ml de silicone"+(c.filCost!=null?" + filament":"") : "dimensions à compléter");
  });
  // Frais en plus
  (p.extras||[]).forEach(e=> add(e.label||"Autre", e.amount==null?null:+e.amount, "frais ajouté"));
  const total = lines.reduce((s,l)=>s+(l.amount||0),0);
  const missing = lines.filter(l=>l.amount==null).length;
  return { lines, total, missing };
}

/* ---------- BESOINS D'UN PROJET (liste de courses + stock) ---------- */
function micaTsp(plan){
  const S = state.settings, tsp = {};
  plan.stages.forEach(st=>st.batches.forEach(b=>b.fontes.forEach(f=>b.colors.forEach(cid=>{
    const c = getCol(cid); if(c && c.type==="poudre") tsp[cid] = (tsp[cid]||0) + f.grams/100*(+S.micaPer100||1);
  }))));
  return tsp;
}
function projectNeeds(p, plan){
  plan = plan || computePlan(p);
  const S = state.settings, out = [], r2 = x=>Math.round(x*100)/100;
  const row = (label, need, have, unit, link, fmt) => out.push({ label, need, have, unit, link, fmt,
    missing: have==null ? null : have < need - 1e-9, short: have==null ? null : Math.max(0, need-have) });
  const wax = getWax(p.waxId);
  if(plan.totals.wax>0) row(wax.name, plan.totals.wax, wax.stock==null?null:+wax.stock, "g", waxLink(wax), x=>num(x)+" g");
  Object.entries(plan.totals.frag).forEach(([fid,x])=>{ const f = getFrag(fid); if(f) row("Fragrance "+f.name, r2(x), f.stock==null?null:+f.stock, "flacon", buyLink(f), v=>num(v,2)+" flacon"+(v>1?"s":"")); });
  Object.entries(micaTsp(plan)).forEach(([cid,t])=>{ const c = getCol(cid); if(c) row(c.name, r2(t/(+S.micaTspPerPot||15)), c.stock==null||c.stock===""?null:+c.stock, "pot", buyLink(c), v=>num(v,2)+" pot"); });
  // Autres colorants (copeaux, paillettes, stylos) : on vérifie seulement qu'il en reste
  const others = new Set((p.items||[]).flatMap(it=>(it.layers||[]).flatMap(l=>l.colors||[])));
  others.forEach(cid=>{ const c = getCol(cid); if(!c || c.type==="poudre") return;
    const have = c.stock==null||c.stock==="" ? null : +c.stock;
    out.push({ label:c.name, need:null, have, unit:c.unit||"", link:buyLink(c), fmt:v=>num(v,2)+" "+(c.unit||""), missing: have==null ? null : have<=0, short:null, light:true }); });
  // Silicone des moules à fabriquer
  (p.moldProjects||[]).forEach(id=>{
    const mp = state.moldProjects.find(x=>x.id===id); if(!mp || mp.silDeducted) return;
    const c = moldProjectCalc(mp), P = silProduct(mp); if(!P || !(c.total>0)) return;
    [["a","A"],["b","B"]].forEach(([k,l])=>{ const have = P[k].stockMl!=null ? +P[k].stockMl : +P[k].ml||0, need = k==="a"?c.aMl:c.bMl;
      out.push({ label:(P.name||"Silicone")+" — partie "+l+" ("+(mp.name||"moule")+")", need:Math.round(need), have, unit:"ml", link:safeUrl(P.link), fmt:v=>num(v)+" ml", missing: have<need, short:Math.max(0,need-have) }); });
  });
  return out;
}
function renderShopping(p, plan){
  const N = projectNeeds(p, plan);
  if(!N.length) return null;
  const miss = N.filter(x=>x.missing===true), unk = N.filter(x=>x.missing===null);
  const card = h("div",{class:"card"}, h("h2",{},"🛒 Liste de courses"));
  card.append(h("div",{class:"muted small", style:"margin-bottom:8px"}, miss.length ? miss.length+" produit(s) à racheter avant la journée." : (unk.length ? "Rien ne manque d'après ton stock (certains stocks ne sont pas renseignés)." : "Tout est en stock ✓")));
  N.slice().sort((a,b)=>(b.missing===true)-(a.missing===true) || (a.missing===null)-(b.missing===null)).forEach(x=>{
    const st = x.missing===true ? ["⚠","var(--red)"] : x.missing===null ? ["?","var(--amber)"] : ["✓","var(--done)"];
    const detail = x.light ? (x.have==null ? "stock non renseigné" : x.missing ? "épuisé" : "reste "+x.fmt(x.have))
      : "besoin "+x.fmt(x.need)+" · "+(x.have==null ? "stock non renseigné" : "en stock "+x.fmt(x.have))+(x.missing ? " → manque "+x.fmt(x.short) : "");
    card.append(h("div",{class:"row", style:"padding:6px 0;border-bottom:1px dashed var(--border)"},
      h("span",{style:"font-weight:800;width:18px;color:"+st[1]}, st[0]),
      h("div",{class:"grow"}, h("div",{style:"font-size:.86rem;font-weight:600"}, x.label), h("div",{class:"muted small"}, detail)),
      x.link && x.missing!==false ? h("a",{ class:"buy", href:x.link, target:"_blank", rel:"noopener" },"🛒") : null));
  });
  return card;
}

function lowStockList(){

/* Déduction du stock (cire, fragrances, mica) — annulable exactement */
function applyStock(p, sign){
  if(sign<0){
    const plan = computePlan(p), wax = getWax(p.waxId), S = state.settings, log = { waxId:wax.id, wax:0, frag:{}, mica:{} };
    // on ne descend jamais sous 0 ; le journal garde ce qui a vraiment été retiré (pour annuler exactement)
    if(wax.stock!=null){ const d = Math.min(+wax.stock, plan.totals.wax); log.wax = d; wax.stock = Math.round(+wax.stock - d); }
    Object.entries(plan.totals.frag).forEach(([fid,x])=>{ const f=getFrag(fid); if(f && f.stock!=null){ const d = Math.min(+f.stock, x); log.frag[fid]=d; f.stock = Math.round((+f.stock - d)*100)/100; } });
    Object.entries(micaTsp(plan)).forEach(([cid,t])=>{ const c=getCol(cid); if(c && c.stock!=null && c.stock!==""){ const d = Math.min(+c.stock, t/(+S.micaTspPerPot||15)); log.mica[cid]=d; c.stock = Math.round((+c.stock - d)*100)/100; } });
    p.deductLog = log; p.deducted = true;
  } else if(p.deductLog){
    const L = p.deductLog, wax = state.waxes.find(w=>w.id===L.waxId);
    if(wax && wax.stock!=null) wax.stock = Math.round(+wax.stock + L.wax);
    Object.entries(L.frag).forEach(([fid,x])=>{ const f=getFrag(fid); if(f && f.stock!=null) f.stock = Math.round((+f.stock + x)*100)/100; });
    Object.entries(L.mica).forEach(([cid,x])=>{ const c=getCol(cid); if(c && c.stock!=null) c.stock = Math.round((+c.stock + x)*100)/100; });
    p.deductLog = null; p.deducted = false;
  } else p.deducted = false;
  saveNow(); rerender(); toast(sign<0 ? "Stock mis à jour" : "Déduction annulée");
}

/* ---------- COÛT PAR MOULE (pour le partage entre participants) ---------- */
function itemCost(p, it){
  const S = state.settings, m = getMold(it.moldId); if(!m) return 0;
  const mg = 1+(+S.margin||0)/100, q = +it.qty||1, wax = getWax(p.waxId), kg = waxPerKg(wax.id);
  const brush = (it.layers||[]).filter(l=>(getTech(l.tech)||{}).behavior==="brush").length*(+S.brushGrams||5);
  const g = ((+m.weight||0)+brush)*q*mg;
  let cost = kg!=null ? g/1000*kg : 0;
  if(it.fragId){ const u = unitPrice(it.fragId); if(u!=null) cost += (+m.weight||0)*q*mg/(+S.fragRef||700)*u; }
  itemParts(it, m).L.forEach(x=>(x.colors||[]).forEach(cid=>{ const c = getCol(cid); if(!c || c.type!=="poudre") return;
    const lg = x.t.behavior==="brush" ? (+S.brushGrams||5) : x.g; const u = unitPrice(cid);
    if(u!=null) cost += lg*q*mg/100*(+S.micaPer100||1)/(+S.micaTspPerPot||15)*u; }));
  return cost;
}
function participantShares(p, budget){
  const P = p.participants||[]; if(!P.length) return null;
  const items = (p.items||[]).map(it=>({ it, cost:itemCost(p,it) }));
  const sumItems = items.reduce((s,x)=>s+x.cost,0);
  const common = Math.max(0, budget.total - sumItems) + items.filter(x=>!P.some(q=>q.id===x.it.who)).reduce((s,x)=>s+x.cost,0);
  return P.map(q=>{ const own = items.filter(x=>x.it.who===q.id); const o = own.reduce((s,x)=>s+x.cost,0);
    return { q, own, ownCost:o, common:common/P.length, total:o+common/P.length }; });
}

/* =========================================================
   TEMPÉRATURE : relevés au pistolet infrarouge + prédiction (refroidissement de Newton)
   T(t) = Tamb + (T0 − Tamb)·e^(−k·t)   — k dépend de la quantité de cire
   ========================================================= */
const K300_DEFAULT = 0.022;   // /min pour ~300 g dans le récipient silicone (≈ 17 min de 85 à 65 °C), affiné par tes relevés
function ambient(){ return +state.settings.ambient || 20; }
function learnedK300(){
  const hist = state.coolHistory||[];
  if(!hist.length) return null;
  const v = hist.map(x=>x.k*Math.cbrt(Math.max(x.g,30)/300)).sort((a,b)=>a-b);
  return v[Math.floor(v.length/2)];
}
function kForGrams(g){ return (learnedK300()||K300_DEFAULT) * Math.cbrt(300/Math.max(+g||300,30)); }
function fonteK(p, fo){
  const r = ((p.temps||{})[fo.fk])||[], Ta = ambient();
  if(r.length>=2){
    const a = r[0], b = r[r.length-1], dt = (b.t-a.t)/60000;
    if(dt>=1 && a.T-Ta>1 && b.T-Ta>1 && b.T<a.T){ const k = Math.log((a.T-Ta)/(b.T-Ta))/dt; if(k>0 && k<1) return { k, measured:true }; }
  }
  return { k:kForGrams(fo.grams), measured:false };
}
function minutesTo(Tnow, Ttarget, k){ const Ta = ambient(); if(Tnow<=Ttarget) return 0; if(Ttarget<=Ta) return Infinity; return Math.log((Tnow-Ta)/(Ttarget-Ta))/k; }
/* Prédiction à partir du dernier relevé : [{t, label, min}] pour les cibles pas encore cochées */
function fontePrediction(p, fo){
  const r = ((p.temps||{})[fo.fk])||[]; if(!r.length) return null;
  const last = r[r.length-1], { k, measured } = fonteK(p, fo);
  const elapsed = (Date.now()-last.t)/60000;
  const nowT = ambient() + (last.T-ambient())*Math.exp(-k*elapsed);
  const seen = new Set();
  const list = fo.targets.filter(x=>!(p.checks||{})[x.key]).filter(x=>{ const id=x.t+x.label; if(seen.has(id)) return false; seen.add(id); return true; })
    .map(x=>({ t:x.t, label:x.label, min: Math.max(0, minutesTo(last.T, x.t, k) - elapsed) }));
  return { last, nowT, list, measured };
}
function predictionText(pr){
  if(!pr) return "";
  const parts = pr.list.map(x=> x.min<0.5 ? x.t+" °C ("+x.label+") : maintenant" : x.t+" °C ("+x.label+") dans ≈ "+Math.round(x.min)+" min");
  return "≈ "+Math.round(pr.nowT)+" °C maintenant · "+(parts.join(" · ")||"toutes les étapes faites")+(pr.measured?"":" (estimation, 2 relevés l'affinent)");
}
function recordTemp(p, fo, T){
  p.temps = p.temps||{};
  (p.temps[fo.fk] = p.temps[fo.fk]||[]).push({ t:Date.now(), T:+T });
  // Apprentissage : on garde la vitesse de refroidissement mesurée de cette fonte
  const fk = fonteK(p, fo), r = p.temps[fo.fk];
  if(fk.measured && (r[r.length-1].t-r[0].t)/60000>=3 && r[0].T-r[r.length-1].T>=5){
    state.coolHistory = (state.coolHistory||[]).filter(x=>x.id!==p.id+fo.fk);
    state.coolHistory.push({ id:p.id+fo.fk, g:fo.grams, k:fk.k, date:today() });
    if(state.coolHistory.length>30) state.coolHistory = state.coolHistory.slice(-30);
  }
  // Alarme automatique pour la prochaine température
  const pr = fontePrediction(p, fo);
  state.timers = state.timers.filter(x=>x.auto!==p.id+fo.fk);
  const nxt = pr && pr.list.find(x=>x.min>=0.5);
  if(nxt && isFinite(nxt.min)){
    state.timers.push({ id:uid(), auto:p.id+fo.fk, label:fo.label+" : "+nxt.t+" °C ("+nxt.label+")", end:Date.now()+nxt.min*60000, fired:false });
    toast("Alarme réglée : "+nxt.t+" °C dans ≈ "+Math.round(nxt.min)+" min");
  } else if(pr && pr.list.length) toast("C'est le moment : "+pr.list[0].t+" °C ("+pr.list[0].label+")");
  saveNow(); renderTimers();
}

/* =========================================================
   PLANNING DE LA JOURNÉE
   ========================================================= */
function meltMinutes(g){
  const S = state.settings, big = +S.meltTime700 || 35, small = +S.meltTimeSmall || 12;   // estimations tant que non mesuré
  const x = Math.max(0, Math.min(1, ((+g||0)-150)/(700-150)));
  return Math.max(3, small + (big-small)*x);
}
function computePlanning(p, built){
  const wax = getWax(p.waxId);
  let app0 = 0, pit = 0, stageReady = 0, lastPour = 0;
  const ev = [];
  built.timeline.forEach(it=>{
    if(it.type==="wait"){
      ev.push({ lane:2, a:lastPour, b:lastPour+it.min, label:"Durcissement "+it.min+" min" });
      stageReady = lastPour + it.min; return;
    }
    const mStart = app0, mEnd = mStart + meltMinutes(it.grams);
    const wipe = it.colorChange ? 2 : 0;
    const transfer = Math.max(mEnd, pit + wipe);
    app0 = transfer + 1;
    const cool = minutesTo(+wax.melt, +wax.pour, kForGrams(it.grams));
    const work = it.brush ? 2*Math.max(1,it.units) : 2 + Math.min(10, it.units);
    const pStart = Math.max(transfer + (isFinite(cool)?cool:20), stageReady), pEnd = pStart + work;

    pit = pEnd; lastPour = Math.max(lastPour, pEnd);

function hhmm(min){ const m = ((Math.round(min)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function renderPlanning(p, built){

    row.append(track); gantt.append(row);

  gantt.append(h("div",{class:"g-axis"}, h("span",{}, hhmm(start)), h("span",{}, hhmm(start+pl.total/2)), h("span",{}, hhmm(start+pl.total))));
  body.append(gantt);

    h("span",{style:"font-family:var(--mono);font-weight:700;min-width:96px"}, hhmm(start+e.a)+"–"+hhmm(start+e.b)),
    h("span",{class:"dot", style:"background:"+colors[e.lane]}), h("span",{class:"grow"}, e.label))));

   MODE ATELIER MAINS LIBRES (lecture à voix haute, un appui = étape suivante)
   ========================================================= */
let atelierOn = false, atelierMute = false;
function speakText(t){
  if(atelierMute || !("speechSynthesis" in window)) return;
  const s = t.replace(/(\d+) ½/g,"$1 et demi").replace(/½/g,"un demi").replace(/¼/g,"un quart").replace(/¾/g,"trois quarts").replace(/⅓/g,"un tiers").replace(/⅔/g,"deux tiers")
    .replace(/°C/g," degrés").replace(/≈/g,"environ").replace(/c\. à café/g,"cuillère à café").replace(/×\s?/g,"fois ").replace(/(\d)\s?g\b/g,"$1 grammes")
    .replace(/ml\b/g,"millilitres").replace(/n°/g,"numéro ").replace(/[—→⇄⚠]/g,", ");
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s); u.lang = "fr-FR"; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang)); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function openAtelier(p){
  atelierOn = true;
  if(!wantWake){ wantWake = true; acquireWake(); }
  const built = buildChecklist(p);
  built.sections.forEach(s=>{ ((p.extra||{})[s.id]||[]).forEach(t=> s.steps.push({ key:t.key, text:t.text, custom:true })); });
  const flat = [];
  built.sections.forEach(s=> s.steps.forEach(st=>{ if(st.key && !st.sub && !st.info) flat.push(Object.assign({ section:s.title }, st)); }));
  const ov = h("div",{class:"at-ov"});
  document.body.append(ov);
  let lastSpoken = null;
  const draw = ()=>{
    ov.innerHTML = "";
    const idx = flat.findIndex(s=>!p.checks[s.key]);
    const done = flat.filter(s=>p.checks[s.key]).length;
    const top = h("div",{class:"at-top"},
      h("button",{ onclick:e=>{ e.stopPropagation(); close(); }},"✕ Quitter"),
      h("span",{class:"grow", style:"text-align:center;font-family:var(--mono)"}, done+" / "+flat.length),
      h("button",{ onclick:e=>{ e.stopPropagation(); atelierMute = !atelierMute; if(atelierMute) try{ speechSynthesis.cancel(); }catch(x){} draw(); }}, atelierMute ? "🔇" : "🔊"));
    ov.append(top);
    if(idx<0){
      ov.append(h("div",{class:"at-main"}, h("div",{class:"at-text"},"Tout est fait ! 🎉"), h("div",{class:"at-sec"},"Pense aux photos et au résultat dans le projet.")));
      if(lastSpoken!=="fin"){ lastSpoken="fin"; speakText("Tout est fait. Bravo !"); }
      return;
    }
    const st = flat[idx], pv = flat[idx-1], nx = flat[idx+1];
    const fo = st.fk ? built.fontes.find(f=>f.fk===st.fk) : null;
    const whoTxt = x => x && x.who && x.who.length ? " · 👤 "+x.who.join(", ") : "";
    const main = h("div",{class:"at-main", onclick:()=>{ p.checks[st.key] = true; saveNow(); draw(); }},
      pv ? h("div",{class:"at-prev"}, h("b",{},"✓ Étape précédente"+(pv.section!==st.section?" · "+pv.section:"")), pv.text+whoTxt(pv)) : null,
      st.who && st.who.length ? h("div",{class:"at-who"},"👤 Pour "+st.who.join(", ")) : null,
      h("div",{class:"at-sec"}, st.section+(fo?" · "+fo.label+" ("+fo.grams+" g)":"")),
      st.temp!=null ? h("div",{class:"at-temp"}, st.temp+" °C") : null,
      h("div",{class:"at-text"}, (st.par?"⇄ ":"")+st.text),
      st.note ? h("div",{class:"at-note"}, st.note) : null,
      h("div",{class:"at-hint"},"Touche n'importe où pour valider ✓"),
      nx ? h("div",{class:"at-next"}, h("b",{},"Ensuite"+(nx.section!==st.section?" · "+nx.section:"")), (nx.temp!=null?nx.temp+" °C · ":"")+nx.text+whoTxt(nx)) : null
    );
    ov.append(main);
    const bottom = h("div",{class:"at-bot"});
    bottom.append(h("button",{ onclick:e=>{ e.stopPropagation(); const prev = [...flat.slice(0,idx)].reverse().find(s=>p.checks[s.key]); if(prev){ p.checks[prev.key]=false; saveNow(); draw(); } }},"◀ Retour"));
    bottom.append(h("button",{ onclick:e=>{ e.stopPropagation(); lastSpoken=null; speakText(st.text); }},"🔁 Répéter"));
    if(st.timer) bottom.append(h("button",{class:"hi", onclick:e=>{ e.stopPropagation(); startTimer(st.section.replace(/^\d+\.\s*/,"")+" — durcissement", st.timer); }},"▶ "+st.timer+" min"));
    if(fo) bottom.append(h("button",{class:"hi", onclick:e=>{ e.stopPropagation(); askTemp(fo.label+" — température", T=>{ recordTemp(p, fo, T); draw(); }); }},"🌡️ Température"));
    ov.append(bottom);
    if(fo){ const pr = fontePrediction(p, fo); if(pr) ov.insertBefore(h("div",{class:"at-pred"}, "🌡️ "+predictionText(pr)), bottom); }
    if(lastSpoken!==st.key){ lastSpoken = st.key; speakText((st.who && st.who.length && (!pv || (pv.who||[]).join()!==st.who.join()) ? "Pour "+st.who.join(", ")+". " : "")+(st.temp!=null?"À "+st.temp+" °C. ":"")+st.text); }
  };
  const close = ()=>{ atelierOn = false; try{ speechSynthesis.cancel(); }catch(e){} clearInterval(tick); ov.remove(); rerender(); };
  const tick = setInterval(()=>{ const el = ov.querySelector(".at-pred"); if(!el) return; const st = flat.find(s=>!p.checks[s.key]); const fo = st && st.fk ? built.fontes.find(f=>f.fk===st.fk) : null; if(fo){ const pr = fontePrediction(p, fo); if(pr) el.textContent = "🌡️ "+predictionText(pr); } }, 15000);
  draw();
}

/* Lecture d'un fichier STL (binaire ou texte) : dimensions + volume réel de la pièce.
   Volume = somme des tétraèdres (origine, triangle) — exact pour un maillage fermé. Unités : mm. */
function parseSTL(buf, keepPositions){
  const dv = new DataView(buf);
  let tris = 0, vol = 0;
  const mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
  const grid = new Map();     // points XY dédoublonnés (0,2 mm) pour le contour vu de dessus
  let pos = null, pi = 0;
  const add = (a,b,c) => {
    vol += (a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
    [a,b,c].forEach(p=>{
      for(let k=0;k<3;k++){ if(p[k]<mn[k]) mn[k]=p[k]; if(p[k]>mx[k]) mx[k]=p[k]; }
      const key = Math.round(p[0]*5)+","+Math.round(p[1]*5); if(!grid.has(key)) grid.set(key, [p[0],p[1]]);
      if(pos){ if(pos.push) pos.push(p[0],p[1],p[2]); else { pos[pi++]=p[0]; pos[pi++]=p[1]; pos[pi++]=p[2]; } }
    });
    tris++;
  };
  const isBinary = buf.byteLength >= 84 && 84 + dv.getUint32(80,true)*50 === buf.byteLength;
  if(keepPositions) pos = isBinary ? new Float32Array(dv.getUint32(80,true)*9) : [];
  if(isBinary){
    const n = dv.getUint32(80,true);
    for(let i=0;i<n;i++){
      const o = 84 + i*50 + 12, v = j => [dv.getFloat32(o+j*12,true), dv.getFloat32(o+j*12+4,true), dv.getFloat32(o+j*12+8,true)];
      add(v(0), v(1), v(2));
    }
  } else {
    const txt = new TextDecoder().decode(buf);
    const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g;
    let m, pts = [];
    while((m = re.exec(txt))){ pts.push([+m[1],+m[2],+m[3]]); if(pts.length===3){ add(pts[0],pts[1],pts[2]); pts = []; } }
  }
  if(!tris) throw new Error("vide");
  // Contour vu de dessus (enveloppe convexe), ramené au coin bas-gauche de la pièce
  const hull = convexHull([...grid.values()]).map(p=>[Math.round((p[0]-mn[0])*10)/10, Math.round((p[1]-mn[1])*10)/10]);
  let positions = null;
  if(pos){ positions = pos instanceof Float32Array ? pos : new Float32Array(pos); for(let i=0;i<positions.length;i+=3){ positions[i]-=mn[0]; positions[i+1]-=mn[1]; positions[i+2]-=mn[2]; } }
  return { tris, volMl: Math.abs(vol)/1000, size: [mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]], binary:isBinary, hull, positions };
}
function loadSTLInto(mp){
  const fi = h("input",{ type:"file", accept:".stl,model/stl,application/sla,application/octet-stream", style:"display:none" });
  fi.addEventListener("change", async ()=>{
    const f = fi.files[0]; fi.remove(); if(!f) return;
    try{
      const buf = await f.arrayBuffer();
      const r = parseSTL(buf, true);
      const round1 = x => Math.round(x*10)/10;
      mp.L = round1(r.size[0]); mp.W = round1(r.size[1]); mp.H = round1(r.size[2]);
      mp.pieceMl = round1(r.volMl);
      mp.stlInfo = { name:f.name, tris:r.tris, date:today(), size:r.size.map(round1), volMl:round1(r.volMl), hull:r.hull,
                     slabs: computeSlabs(r.positions, r.size[2], 2) };
      if(!mp.scale) mp.scale = 100;
      if(!mp.boxShape) mp.boxShape = "ajuste";
      // Fichier gardé sur cet appareil pour l'aperçu 3D (pas dans l'export)
      try{ await PDB.put("stl_"+mp.id, buf); mp.stlStored = true; }catch(e){ mp.stlStored = false; }
      saveNow(); rerender(); toast("Fichier lu : "+mp.pieceMl+" ml");
    }catch(e){ toast("⚠ Fichier .stl illisible"); }
  });
  document.body.appendChild(fi); fi.click();
}

/* ---------- Géométrie 2D (contour du cadre) ---------- */
function convexHull(pts){
  const P = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(P.length<3) return P;
  const cr = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for(const p of P){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop();
  return lo.concat(up);   // sens anti-horaire
}
function polyArea(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return a/2; }
function polyBBox(P){ const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]); return { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) }; }
/* Contour convexe agrandi de d (coins arrondis) */
function offsetConvex(P, d){
  const n = P.length, out = [];
  const nrm = (a,b)=>{ const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [dy/l, -dx/l]; };
  for(let i=0;i<n;i++){
    const a=P[(i-1+n)%n], v=P[i], b=P[(i+1)%n];
    const n0 = nrm(a,v), n1 = nrm(v,b);
    const t0 = Math.atan2(n0[1],n0[0]);
    let dt = Math.atan2(n1[1],n1[0]) - t0;
    while(dt > Math.PI) dt -= 2*Math.PI;
    while(dt <= -Math.PI) dt += 2*Math.PI;
    if(dt <= 0){ // coin quasi plat (ou minuscule creux dû aux arrondis) : un seul point, pas d'arc
      const m = [n0[0]+n1[0], n0[1]+n1[1]], l = Math.hypot(m[0],m[1])||1;
      out.push([v[0]+d*m[0]/l, v[1]+d*m[1]/l]); continue;
    }
    const steps = Math.max(1, Math.ceil(dt/(Math.PI/12)));
    for(let s=0;s<=steps;s++){ const t=t0+dt*s/steps; out.push([v[0]+d*Math.cos(t), v[1]+d*Math.sin(t)]); }
  }
  // supprime les points quasi confondus
  return out.filter((p,i)=>{ const q=out[(i+1)%out.length]; return Math.hypot(p[0]-q[0],p[1]-q[1])>0.05; });
}

      const B = [];

      B.push(...boxSolid(X(g0),X(g1), yGd,yF, 0,zTop));
      B.push(...boxSolid(X(g1),X(h0), yS,yF, 0,zTop));
      B.push(...boxSolid(X(h1),X(S.Bw), yS,yF, 0,zTop));

/* Fichiers à imprimer : chaque moitié couchée sur sa face de jonction */
function shellPrintTris(parts, which){
  const cA = parts.cy + parts.t/2, cB = parts.cy - parts.t/2;
  let T;
  if(which==="A") T = parts.A.map(p=>[p[0], -p[2], p[1]-cA]);
  else if(which==="B") T = parts.B.map(p=>[p[0], p[2], cB-p[1]]);
  else T = parts.base.concat(parts.keys, parts.spacers).map(p=>[p[0], p[1], p[2]]);

  T.forEach(p=>{ for(let k=0;k<3;k++){ mn[k]=Math.min(mn[k],p[k]); mx[k]=Math.max(mx[k],p[k]); } });
  return { T: T.map(p=>[p[0]-mn[0], p[1]-mn[1], p[2]-mn[2]]), size:[mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]] };

function downloadShell(mp, which){
  const c = moldProjectCalc(mp), parts = shellParts(mp, c);
  if(!parts){ toast("⚠ Coque impossible à générer"); return; }
  const r = shellPrintTris(parts, which);
  const name = (mp.name||"moule").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([trisToSTL(r.T)], { type:"model/stl" }));
  a.download = "coque-"+name+"-"+({A:"moitie-1",B:"moitie-2",base:"fond-cales-cles"}[which])+".stl";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast("Fichier téléchargé");
}

/* Moule terminé → ajouté à la liste des moules (sélectionnable dans les projets) */
function addMoldFromProject(mp){
  if(mp.moldId && getMold(mp.moldId)) return getMold(mp.moldId);
  const c = moldProjectCalc(mp);
  const isUrl = /^\s*(https?:\/\/|www\.)/i.test(mp.stl||"");
  const m = { id:uid(), name:mp.name||"Moule perso", kind:"silicone", weight:c.waxG||null, cavities:1, copies:1,
              notes:"Moule fait maison"+(c.waxG?" (poids calculé depuis le fichier 3D : vérifie-le à l'eau)":"")+(mp.stl && !isUrl?" — fichier : "+mp.stl:"")+".",
              modelUrl: isUrl ? safeUrl(mp.stl) : "", moldProjectId: mp.id };
  state.molds.push(m);
  mp.moldId = m.id; mp.checks = mp.checks||{}; mp.checks.biblio = true;
  // Stock de silicone : on retire ce que le moule a consommé (une seule fois)

  const done = MOLD_STEPS.filter(s=>mp.checks[s[0]]).length;
  const steps = h("div",{class:"card"}, h("h2",{},"Étapes ("+done+"/"+MOLD_STEPS.length+")"));
  MOLD_STEPS.forEach(([k,txt])=>{
    let t = txt;
    if(k==="peser" && c.total>0) t = "Mesurer A : "+num(c.aMl*conv)+" "+unit+" et B : "+num(c.bMl*conv)+" "+unit+" (ratio "+S.ratioA+":"+S.ratioB+" en "+S.ratioBy+")";
    if(k==="durcir" && S.cureHours) t = "Laisser durcir "+S.cureHours+" h";
    if(k==="melanger" && S.potLife) t += " — temps de travail : "+S.potLife+" min";
    const cb = h("input",{ type:"checkbox", checked:!!mp.checks[k] });
    const row = h("div",{class:"step"+(mp.checks[k]?" done":"")}, cb, h("label",{class:"txt", onclick:()=>{ cb.checked=!cb.checked; cb.dispatchEvent(new Event("change")); }}, t));
    cb.addEventListener("change", ()=>{
      mp.checks[k]=cb.checked;
      if(k==="biblio" && cb.checked && !mp.moldId){ addMoldFromProject(mp); mp.status = "fini"; toast("Moule ajouté à ta liste de moules"); }
      saveNow(); rerender();
    });
    steps.append(row);
  });
  app.append(steps);

  // Lien bibliothèque
  const linked = mp.moldId ? getMold(mp.moldId) : null;
  app.append(h("div",{class:"card"},
    h("h2",{},"Bibliothèque"),
    linked ? h("div",{},
        h("div",{class:"muted"},"✓ Dans ta liste de moules : « "+linked.name+" » ("+(linked.weight?linked.weight+" g de cire":"poids à mesurer")+"). Tu peux le choisir dans un projet."),
        h("button",{class:"btn light sm", style:"margin-top:8px", onclick:()=>{ state.ui.libTab="moules"; state.ui.open[linked.id]=true; go("biblio"); }},"Voir dans la bibliothèque"))
      : h("div",{},
        h("div",{class:"muted small", style:"margin-bottom:8px"},"Il sera ajouté automatiquement à ta liste de moules quand l'étape passera à « Moule prêt »."),
        h("button",{class:"btn block", onclick:()=>{ addMoldFromProject(mp); if(mp.status!=="fini") mp.status = "fini"; saveNow(); rerender(); toast("Moule ajouté à ta liste de moules"); }},"Ajouter maintenant à ma liste de moules"))
  ));
  // Notes + photos
  const pbox = h("div",{class:"card"}, h("h2",{},"Notes & photos"), field("Notes", area(mp,"notes","Ce qui a marché, bulles, temps réel de prise…")));
  const photos = state.photos.filter(x=>x.moldProjectId===mp.id);
  pbox.append(gallery(photos, false));
  pbox.append(h("button",{class:"btn sm", onclick:()=>pickPhoto({ moldProjectId:mp.id, moldId:mp.moldId||null, projectId:null })},"📷 Ajouter une photo"));
  app.append(pbox);
  app.append(h("button",{class:"btn red block", style:"margin-top:4px", onclick:()=>{ if(confirm("Supprimer ce moule à créer ?")){ PDB.del("stl_"+mp.id); state.moldProjects = state.moldProjects.filter(x=>x!==mp); state.projects.forEach(p=>{ if(p.moldProjects) p.moldProjects = p.moldProjects.filter(id=>id!==mp.id); }); state.ui.moldEditing=null; saveNow(); render(); } }},"Supprimer"));
}

async function exportJSON(){
  saveNow();
  const photos = {};
  for(const ph of state.photos){ const s = await photoSrc(ph.id); if(s) photos[ph.id] = s; }
  const blob = new Blob([JSON.stringify({ app:"atelier-bougies", exported:new Date().toISOString(), data:state, photos })], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "atelier-bougiesV2-sauvegarde-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Sauvegarde exportée");
}
document.getElementById("jsonInput").addEventListener("change", async e=>{
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    if(!obj || obj.app!=="atelier-bougies" || !obj.data) throw new Error("format");
    if(!confirm("Remplacer toutes les données actuelles par celles du fichier ?")) return;
    for(const [id,src] of Object.entries(obj.photos||{})){ await PDB.put(id,src); photoCache.set(id,src); }
    state = migrate(obj.data); state.ui.tab = "reglages";
    saveNow(); render(); toast("Import réussi");
  }catch(err){ toast("⚠ Fichier invalide"); }
});

function moldEmoji(m){
  const n = (m.name||"").toLowerCase();
  const E = [["pin","🌲"],["torsade","🌀"],["mini fleur","🌸"],["nénuphar","🪷"],["lutin","🎅"],["flocon","❄️"],["dragon","🐉"],["grosse fleur","🌹"],["fleur","🌼"],["paquet","🎁"],["cadeau","🎁"],["noël","🎄"],["lion","🦁"],["buste","🗿"],["verre","🥃"],["boîte","🕯️"]];
  const f = E.find(([k])=>n.includes(k)); return f ? f[1] : (m.kind==="verre" ? "🫙" : "🕯️");
}
function slug(s){ return (s||"atelier").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "atelier"; }

    const n = cols.length, pct = Math.round(100/n);
    cols.slice(0,-1).forEach(id=> add("couche",[id],{ pct }));
    add("coulee", [cols[n-1]].concat(gl));
  }
  else if(c.style==="marbre" && cols.length) add("marbre", cols);   // paillettes : notées dans les notes (le marbré coule une fonte par couleur)
  else if(c.style==="pinceau"){ if(cols[0]) add("pinceau",[cols[0]],{ zone:c.note||"" }); if(cols[1] || gl.length) add("coulee", (cols[1]?[cols[1]]:[]).concat(gl)); }
  else if(cols.length || gl.length) add("coulee", cols.slice(0,1).concat(gl));
  const pens = (c.pens||[]).filter(id=>getCol(id));
  if(pens.length) add("stylo", pens);
  return L;
}
function candleText(c){
  const nm = id=>{ const x = getCol(id); return x ? x.name.replace(/^(Mica|Copeaux|Paillettes|Stylo)\s+/i,"") : "?"; };
  const cols = (c.colors||[]).map(nm);
  const st = { uni:"Uni", couches:"Couches", marbre:"Marbré", pinceau:"Pinceau" }[c.style] || "Uni";
  let s = c.style==="pinceau" ? "Détails "+(cols[0]||"?")+", fond "+(cols[1]||"naturel") : st+" "+(cols.length ? cols.join(" + ") : "naturel");
  if(c.glitter) s += " · paillettes "+nm(c.glitter);
  if((c.pens||[]).length) s += " · stylo "+c.pens.map(nm).join(", ");
  const f = getFrag(c.frag); s += " · "+(f ? f.name : "sans parfum");
  return s;
}
function candleCostV2(inv, c, moldId){
  const m = getMold(moldId||c.mold); if(!m || !(+m.weight>0)) return null;
  if(waxPerKg(inv.waxId)==null) return null;
  return itemCost({ waxId:inv.waxId }, { moldId:m.id, qty:1, fragId:c.frag||null, layers:candleLayers(c) });
}

/* ---------- Répartition des moules ---------- */
function moldCapacity(inv, m){
  const copies = m.copies==null || m.copies==="" ? 1 : Math.max(0, +m.copies);
  return m.kind==="verre" ? copies : copies*Math.max(1, +inv.usesPerDay||1);   // un pot part avec sa bougie, un moule silicone peut resservir
}
function inviteCandles(inv){
  const R = inv.responses||[], out = [];
  const max = R.reduce((a,r)=>Math.max(a,(r.candles||[]).length),0);
  for(let k=0;k<max;k++) R.forEach(r=>{ if(r.candles[k]) out.push({ key:r.id+"_"+k, r, k, c:r.candles[k] }); });   // tour par tour : la 1re bougie de chacun passe avant les 2es
  return out;
}
function assignMolds(inv){
  const cap = {}, used = {};
  const capOf = id=>{ if(!(id in cap)){ const m = getMold(id); cap[id] = m ? moldCapacity(inv,m) : 0; used[id] = 0; } return cap[id]; };
  const free = id => !!(id && getMold(id) && capOf(id) > used[id]);
  const take = (x, id, how)=>{ capOf(id); used[id]++; x.moldId = id; x.how = how; };
  const L = inviteCandles(inv), ov = inv.override||{};
  L.forEach(x=>{ const o = ov[x.key]; if(o==="none"){ x.moldId = null; x.how = "reporté"; } else if(o && getMold(o)) take(x, o, "choix manuel"); });
  L.forEach(x=>{
    if(x.how) return;
    if(free(x.c.mold)) return take(x, x.c.mold, "1er choix");
    if(x.c.alt && free(x.c.alt)) return take(x, x.c.alt, "2e choix");
    if(!x.c.alt){ const s = moldSuggestions(inv, x, capOf, used)[0]; if(s) return take(x, s.id, "au choix de l'organisateur"); }
    x.moldId = null; x.how = "conflit";
  });
  L.forEach(x=>{ if(x.moldId && used[x.moldId] > capOf(x.moldId)) x.over = true; });
  assignScents(inv, L);
  return { list:L, cap, used, capOf };
}
function moldSuggestions(inv, x, capOf, used){
  const want = getMold(x.c.mold), w = want ? +want.weight||100 : 100;
  return (inv.offer.molds||[]).map(getMold).filter(m=> m && m.id!==x.c.mold && capOf(m.id) > used[m.id])
    .sort((a,b)=> ((want && a.kind!==want.kind)?1:0)-((want && b.kind!==want.kind)?1:0) || (+a.weight>0?0:1)-(+b.weight>0?0:1) || Math.abs((+a.weight||w)-w)-Math.abs((+b.weight||w)-w));
}

/* ---------- Réponses : code collé depuis l'email ---------- */
function decodeInviteCodes(text){
  const out = [], parts = String(text||"").split("BOUGIES1:").slice(1);
  parts.forEach(p=>{
    const raw = p.split(/-{3,}/)[0].replace(/\s+/g,"").replace(/=([0-9A-F]{2})/g,"");   // les messageries coupent parfois les longues lignes
    const m = raw.match(/^[A-Za-z0-9_-]+/); if(!m) return;
    try{
      let b = m[0].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b += "=";
      const o = JSON.parse(decodeURIComponent(escape(atob(b))));
      if(o && o.n && Array.isArray(o.c)) out.push(o);
    }catch(e){}
  });
  return out;
}
function importResponses(inv, text){
  const codes = decodeInviteCodes(text);
  if(!codes.length){ toast("⚠ Aucun code trouvé : colle tout l'email, ligne BOUGIES1:… comprise"); return 0; }
  let other = 0;
  codes.forEach(o=>{
    if(o.i && o.i!==inv.id) other++;
    const candles = o.c.map(a=>({ mold:a[0]||"", alt:a[1]||"", style:a[2]||"uni", colors:a[3]||[], glitter:a[4]||"", pens:a[5]||[], frag:a[6]||"", note:a[7]||"" }));
    const ex = inv.responses.find(r=>r.name.trim().toLowerCase()===o.n.trim().toLowerCase());
    if(ex){
      Object.keys(inv.override).forEach(k=>{ if(k.startsWith(ex.id+"_")) delete inv.override[k]; });
      Object.assign(ex, { email:o.e||ex.email, comment:o.m||"", sent:o.t||null, imported:today(), candles });
    } else inv.responses.push({ id:"rp_"+uid(), name:o.n.trim(), email:o.e||"", comment:o.m||"", sent:o.t||null, imported:today(), candles });
    if(o.e){ const g = inv.guests.find(g=>g.name.trim().toLowerCase()===o.n.trim().toLowerCase()); if(g && !g.email) g.email = o.e; }
  });
  saveNow();
  toast(codes.length+" réponse(s) importée(s)"+(other?" — ⚠ "+other+" venai(en)t d'une autre invitation":""));
  return codes.length;
}
function guestAnswered(inv, g){
  const n = (g.name||"").trim().toLowerCase(), e = (g.email||"").trim().toLowerCase();
  return inv.responses.find(r=> r.name.trim().toLowerCase()===n || (e && (r.email||"").trim().toLowerCase()===e));
}

const thumbCache = new Map();
function moldThumb(m){
  const ph = state.photos.filter(x=>x.moldId===m.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  const key = ph ? ph.id : "def_"+m.id;
  if(thumbCache.has(key)) return Promise.resolve(thumbCache.get(key));
  const src0 = ph ? photoSrc(ph.id) : Promise.resolve(DEFAULT_MOLD_PHOTOS[(m.name||"").trim().toLowerCase()]||null);
  return src0.then(src=> !src ? null : new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{ const max = 360, s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const out = c.toDataURL("image/jpeg",0.72); thumbCache.set(key,out); res(out); };
    img.onerror = ()=>res(null); img.src = src;
  }));
}
async function inviteData(inv, guest){
  const S = state.settings, A = assignMolds(inv), kg = waxPerKg(inv.waxId);
  const mica = {};
  state.colorants.forEach(c=>{ if(c.type==="poudre"){ const u = unitPrice(c.id); if(u!=null) mica[c.id] = (+S.micaPer100||1)/100/(+S.micaTspPerPot||15)*u; } });
  const molds = [];
  for(const id of inv.offer.molds){
    const m = getMold(id); if(!m) continue;
    molds.push({ id:m.id, name:m.name, kind:m.kind, weight:+m.weight||null, cavities:+m.cavities||1,
      copies: m.copies==null||m.copies==="" ? 1 : +m.copies, full: (A.used[m.id]||0) >= A.capOf(m.id),
      emoji:moldEmoji(m), photo: await moldThumb(m), note:m.inviteNote||"" });
  }
  const C = (ids, type)=> ids.map(getCol).filter(c=>c && (!type || type.includes(c.type))).map(c=>({ id:c.id, name:c.name, type:c.type, hex:c.color }));
  return {
    id:inv.id, title:inv.title, date:inv.date, time:inv.time, place:inv.place, host:inv.host, hostEmail:inv.hostEmail, message:inv.message,
    deadline:inv.deadline, maxCandles:+inv.maxCandles||2, commonFee:inv.commonFee, currency:S.currency, guest:guest||"", generated:new Date().toISOString(),
    styles:inv.offer.styles, molds,
    colors:C(inv.offer.colors, ["copeaux","poudre","liquide"]), glitter:C(inv.offer.glitter, ["paillettes"]), pens:C(inv.offer.pens, ["stylo"]),
    frags: inv.offer.frags.map(getFrag).filter(Boolean).map(f=>{ const u = unitPrice(f.id); return { id:f.id, name:f.name, hex:FRAG_HEX[(f.name||"").trim().toLowerCase()]||null, perG: u==null ? null : u/(+S.fragRef||700) }; }),
    prices:{ waxPerG: kg==null ? null : kg/1000, margin:+S.margin||0, brush:+S.brushGrams||5, mica }
  };
}
async function inviteHTML(inv, guest){
  const data = await inviteData(inv, guest);

/* ---------- Projet de la journée ---------- */
function inviteToProject(inv){
  const A = assignMolds(inv);
  let p = inv.projectId && state.projects.find(x=>x.id===inv.projectId);
  if(p && (p.items||[]).length && !confirm("Remplacer les moules et participants du projet « "+(p.title||"")+" » par la répartition actuelle ?\n(Les paiements déjà cochés sont gardés.)")) return;
  if(!p){
    p = { id:uid(), title:"", date:today(), status:"planifie", waxId:inv.waxId, mode:state.settings.mode, ideas:"", items:[], result:"", checks:{}, extra:{}, open:{}, deducted:false };
    state.projects.push(p); inv.projectId = p.id;
  }
  const old = p.participants||[];
  p.participants = inv.responses.map(r=>{ const o = old.find(q=>q.name.trim().toLowerCase()===r.name.trim().toLowerCase()); return { id:o?o.id:"pt_"+uid(), name:r.name, paid:o?!!o.paid:false }; });
  const who = r => p.participants[inv.responses.indexOf(r)].id;
  p.people = Math.max(1, p.participants.length);
  p.title = inv.title; p.date = inv.date || p.date; p.waxId = inv.waxId;
  p.items = A.list.filter(x=>x.moldId).map(x=>{
    const m = getMold(x.moldId), gl = x.c.style==="marbre" && x.c.glitter ? "paillettes "+((getCol(x.c.glitter)||{}).name||"") : "";
    const c = x.e || x.c;
    return { id:uid(), moldId:x.moldId, qty:1, fragId: c.frag && getFrag(c.frag) ? c.frag : null, layers:candleLayers(c),
             notes:[x.r.name, x.c.note, gl].filter(Boolean).join(" — "), who:who(x.r), wick: m && m.kind==="verre" ? "ficelle" : undefined };
  });
  const rest = A.list.filter(x=>!x.moldId);
  const comments = inv.responses.filter(r=>r.comment).map(r=>"💬 "+r.name+" : "+r.comment);
  p.ideas = [rest.length ? "Sans moule (à reporter) : "+rest.map(x=>x.r.name+" — "+((getMold(x.c.mold)||{}).name||"?")).join(", ") : "", ...comments].filter(Boolean).join("\n");
  saveNow(); toast("Projet de la journée prêt ✓");
  return p;
}
function inviteStats(inv, A){
  const tmp = { id:"tmp", title:"", date:inv.date, status:"planifie", waxId:inv.waxId, mode:"lot", items:A.list.filter(x=>x.moldId).map(x=>({ id:x.key, moldId:x.moldId, qty:1, fragId:(x.e||x.c).frag||null, layers:candleLayers(x.e||x.c) })), checks:{}, extra:{}, open:{} };

  }catch(e){ return null; }
}

/* Image d'un produit : lien d'image (https://…) ou photo choisie, réduite et gardée dans les données */
function imgSrc(o){ const s = (o && o.img || "").trim(); return /^data:image\//.test(s) || /^https?:\/\//i.test(s) ? s : ""; }
function itemThumb(o, fallback){
  const box = h("div",{class:"lthumb"});
  const src = imgSrc(o);
  if(src) box.append(h("img",{ src, alt:"", loading:"lazy", referrerpolicy:"no-referrer", onerror:e=>{ e.target.remove(); box.append(fallback||"📦"); } }));
  else box.append(fallback||"📦");
  return box;
}
function smallImage(file, max){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{ const img = new Image();
      img.onload = ()=>{ const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.75)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function imageField(o){
  const src = imgSrc(o);
  const pick = h("input",{ type:"file", accept:"image/*", style:"display:none", onchange:async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ o.img = await smallImage(f, 240); saveNow(); rerender(); toast("Image ajoutée"); }catch(err){ toast("⚠ Image illisible"); } } });
  return field("Image (miniature)", h("div",{class:"row"},
    src ? h("img",{ src, alt:"", style:"width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--amber-soft)" }) : null,
    h("div",{class:"grow"}, h("input",{ type:"url", class:"plain", placeholder:"Colle le lien d'une image, ou choisis une photo →", value: /^https?:/i.test(o.img||"") ? o.img : (o.img ? "(photo choisie)" : ""),
      onchange:e=>{ const v = e.target.value.trim(); if(v==="(photo choisie)") return; o.img = v; saveNow(); rerender(); } })),
    h("button",{class:"btn light sm", onclick:()=>pick.click()},"📷"),
    o.img ? h("button",{class:"xbtn", title:"Retirer l'image", onclick:()=>{ o.img = ""; saveNow(); rerender(); }},"✕") : null,
    pick));
}

/* =========================================================
   V3 : 3 PARFUMS PAR PERSONNE (couleur liée au parfum) + INVITATION EN LIGNE (Firebase)
   Aucune adresse ni donnée personnelle dans ce code : l'adresse de la base et les
   réponses restent dans les réglages du navigateur et dans la base en ligne.
   ========================================================= */

/* ---------- Parfums : chacun en aime 3, on en retient un par bougie ---------- */
function hexDist(a, b){
  const p = x=>{ x = String(x||"").replace("#",""); if(x.length===3) x = x.split("").map(c=>c+c).join(""); const n = parseInt(x,16); return isNaN(n) ? null : [n>>16&255, n>>8&255, n&255]; };
  const A = p(a), B = p(b); if(!A || !B) return 1e9;
  return (A[0]-B[0])**2 + (A[1]-B[1])**2 + (A[2]-B[2])**2;
}
function scentColorOf(inv, fid){
  inv.scentColor = inv.scentColor || {};
  if(fid in inv.scentColor) return inv.scentColor[fid] || "";
  return scentSuggest(inv)[fid] || "";
}
/* Suggestion : à chaque parfum la couleur proposée la plus proche de sa teinte, sans doublon */
function scentSuggest(inv){
  const cols = (inv.offer.colors||[]).map(getCol).filter(c=>c && c.color && !["stylo","paillettes"].includes(c.type) && c.stock!==0);
  const taken = new Set(Object.values(inv.scentColor||{}).filter(Boolean)), out = {};
  (inv.offer.frags||[]).map(getFrag).filter(Boolean).forEach(f=>{
    if(f.id in (inv.scentColor||{})) return;
    const hex = FRAG_HEX[(f.name||"").trim().toLowerCase()]; if(!hex) return;
    const best = cols.filter(c=>!taken.has(c.id)).sort((a,b)=>hexDist(a.color,hex)-hexDist(b.color,hex))[0];
    if(best){ out[f.id] = best.id; taken.add(best.id); }
  });
  return out;
}
function assignScents(inv, L){
  const S = L.filter(x=>x.moldId && x.r.likes && x.r.likes.length);
  const ov = inv.scentOv || {}, pool = new Set();
  S.forEach(x=>{ const o = ov[x.key]; if(o && getFrag(o)){ x.scent = o; x.scentHow = "choix manuel"; } else pool.add(x); });
  // Glouton : on retient d'abord le parfum aimé par le plus de monde → peu de fontes différentes
  while(pool.size){
    const score = {};
    pool.forEach(x=> x.r.likes.forEach((f,i)=>{ if(getFrag(f)) score[f] = (score[f]||0) + 10 + Math.max(0, 2-i); }));
    S.forEach(x=>{ if(!pool.has(x) && x.scent && score[x.scent]!=null) score[x.scent] += 4; });
    const best = Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
    if(!best){ pool.forEach(x=>{ x.scent = ""; x.scentHow = "parfum inconnu"; }); break; }
    [...pool].forEach(x=>{ const i = x.r.likes.indexOf(best[0]); if(i>=0){ x.scent = best[0]; x.scentHow = i===0 ? "parfum préféré" : "parfum n°"+(i+1); pool.delete(x); } });
  }
  S.forEach(x=>{
    const col = scentColorOf(inv, x.scent);
    x.e = Object.assign({}, x.c, { style:"uni", colors: col && getCol(col) ? [col] : [], glitter:"", frag:x.scent||"" });
  });
}
function scentLine(inv, r, x){
  const nm = id=>{ const f = getFrag(id); return f ? f.name : "?"; };
  let s = "aime "+r.likes.map(nm).join(", ");
  if(x && x.scent){ const c = getCol(scentColorOf(inv, x.scent)); s += " → "+nm(x.scent)+(c?" ("+c.name+")":" (naturel)"); }
  const pens = ((x && x.c.pens)||[]).map(getCol).filter(Boolean);
  if(pens.length) s += " · stylo "+pens.map(c=>c.name).join(", ");
  return s;
}
function scentSelect(inv, r, x){

  });
  if(!(inv.offer.frags||[]).length) box.append(h("div",{class:"muted small"},"Coche d'abord les parfums proposés juste au-dessus."));
  return box;
}

/* ---------- Base en ligne (Firebase Realtime Database, API REST) ---------- */
function fbBase(){
  let u = (state.settings.fbUrl||"").trim(); if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://"+u;
  try{ const x = new URL(u); return "https://"+x.host; }catch(e){ return ""; }
}
async function fbReq(method, path, data){
  const base = fbBase(); if(!base) throw new Error("Adresse de la base manquante");
  const r = await fetch(base+"/"+path+".json", { method, body: data===undefined ? undefined : JSON.stringify(data) });
  if(!r.ok) throw new Error(r.status===401 || r.status===403 ? "Accès refusé : vérifie les règles de la base" : "Erreur "+r.status);
  return r.json();
}
function siteBase(){
  let u = (state.settings.siteUrl||"").trim();
  if(!u && /^https?:$/.test(location.protocol)) u = location.href.replace(/[#?].*$/,"").replace(/[^/]*$/,"");
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://"+u;
  return u.replace(/[#?].*$/,"").replace(/\/[^/]*\.html?$/i,"/").replace(/\/?$/,"/");
}
function onlineLink(inv, extra){
  const s = siteBase(), b = fbBase(); if(!s || !b) return "";
  return s+"choix.html#a="+encodeURIComponent(inv.id)+"&db="+encodeURIComponent(b.replace(/^https:\/\//,""))+(extra||"");
}
async function onlineOffer(inv){
  const A = assignMolds(inv), molds = [];
  for(const id of inv.offer.molds){
    const m = getMold(id); if(!m) continue;
    molds.push({ id:m.id, name:m.name, kind:m.kind, cap:A.capOf(m.id), emoji:moldEmoji(m), photo:(await moldThumb(m))||"", note:m.inviteNote||"", w:+m.weight||0 });
  }
  const frags = (inv.offer.frags||[]).map(getFrag).filter(Boolean).map(f=>{ const c = getCol(scentColorOf(inv, f.id)); return { id:f.id, name:f.name, hex:c ? c.color : (FRAG_HEX[(f.name||"").trim().toLowerCase()]||"#F4EBDD"), col:c ? c.name : "naturel" }; });
  const pens = inv.offer.styles.includes("stylo") ? (inv.offer.pens||[]).map(getCol).filter(Boolean).map(c=>({ id:c.id, name:c.name, hex:c.color })) : [];
  return { title:inv.title||"Atelier bougies", date:inv.date||"", time:inv.time||"", place:inv.place||"", host:inv.host||"", message:inv.message||"",
    deadline:inv.deadline||"", maxCandles:+inv.maxCandles||2, pick:+inv.pickScents||3, commonFee:inv.commonFee==null?null:+inv.commonFee, currency:state.settings.currency,
    closed:!!inv.onlineClosed, molds, frags, pens, v:3 };
}

    inv.onlineAt = new Date().toISOString(); saveNow();

async function onlineDelete(inv, webId){ try{ await fbReq("DELETE", "ateliers/"+inv.id+"/responses/"+webId); }catch(e){ toast("⚠ Pas retirée en ligne : "+e.message); } }
function arr(x){ return Array.isArray(x) ? x : x && typeof x==="object" ? Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]) : []; }
function onlineMerge(inv, data){
  data = data || {}; let changed = false; const news = [];
  const before = inv.responses.length;
  inv.responses = inv.responses.filter(r=> !r.web || data[r.web]);
  if(inv.responses.length!==before) changed = true;
  Object.entries(data).filter(([k,v])=>v && v.n).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).forEach(([k,v])=>{
    const candles = arr(v.c).filter(x=>x && x.mold).map(x=>({ mold:x.mold, alt:"", style:"uni", colors:[], glitter:"", pens:arr(x.pens), frag:"", note:x.note||"" }));
    const likes = arr(v.f).filter(Boolean), name = String(v.n).trim().slice(0,40);
    const sig = JSON.stringify([name, candles, likes, v.m||""]);
    const r = inv.responses.find(x=>x.web===k);
    if(r){
      if(r.sig!==sig){ Object.assign(r, { name, comment:v.m||"", candles, likes, sig, sent:v.u?new Date(v.u).toISOString():r.sent });
        Object.keys(inv.override).forEach(kk=>{ if(kk.startsWith(r.id+"_")) delete inv.override[kk]; });
        Object.keys(inv.scentOv||{}).forEach(kk=>{ if(kk.startsWith(r.id+"_")) delete inv.scentOv[kk]; });
        changed = true; news.push(name+" a modifié ses choix"); }
    } else {
      inv.responses.push({ id:"rp_"+uid(), web:k, name, email:"", comment:v.m||"", sent:v.t?new Date(v.t).toISOString():null, imported:today(), candles, likes, sig });
      changed = true; news.push("Nouveau : "+name);
    }
  });
  return { changed, news };
}
let LIVE = null;
async function onlinePull(inv, quiet){
  try{
    const data = await fbReq("GET", "ateliers/"+inv.id+"/responses");
    const res = onlineMerge(inv, data);
    if(LIVE && LIVE.id===inv.id) LIVE.ok = true;
    if(res.changed){
      saveNow();
      if(!quiet && res.news.length) toast("🕯️ "+res.news.join(" · "));
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if(state.ui.tab==="prep" && state.ui.inviteEditing===inv.id && !typing) rerender();
    }
  }catch(e){ if(LIVE && LIVE.id===inv.id) LIVE.ok = false; if(!quiet) toast("⚠ "+e.message); }
}
function onlineWatch(inv, force){
  if(!fbBase() || !inv.onlineAt) return;
  if(LIVE && LIVE.id===inv.id && !force) return;
  if(LIVE){ try{ LIVE.es.close(); }catch(e){} }
  LIVE = { id:inv.id, ok:null, es:null, t:null };
  const pull = ()=>{ clearTimeout(LIVE.t); LIVE.t = setTimeout(()=>{ const i = getInvite(LIVE.id); if(i) onlinePull(i); }, 400); };
  try{
    const es = new EventSource(fbBase()+"/ateliers/"+inv.id+"/responses.json");
    es.addEventListener("put", pull); es.addEventListener("patch", pull);
    es.onopen = ()=>{ LIVE.ok = true; };
    es.onerror = ()=>{ LIVE.ok = false; };
    LIVE.es = es;
  }catch(e){ setInterval(pull, 30000); }
  onlinePull(inv, true);
}

async function shareLink(inv){
  const link = onlineLink(inv), text = "🕯️ "+(inv.title||"Atelier bougies")+(inv.date?" — "+fmtDate(inv.date):"")+"\nChoisis ton moule et tes parfums ici (les moules déjà pris sont indiqués en direct) :\n"+link;
  try{ if(navigator.share){ await navigator.share({ title:inv.title||"Atelier bougies", text }); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("Message et lien copiés : colle-les dans WhatsApp ou un SMS"); }
  catch(e){ prompt("Copie ce message :", text); }
}
function onlineCard(inv){
  const S = state.settings;
  const card = h("div",{class:"card", style:"border-left:4px solid var(--blue)"}, h("h2",{},"🌐 Invitation en ligne (choix en direct)"));
  const ready = fbBase() && siteBase();
  if(!ready || /console\.firebase/i.test(S.fbUrl||"") || state.ui.onlineSetup) return onlineSettingsCard(false);
  if(inv.onlineAt) onlineWatch(inv);
  const link = onlineLink(inv);
  if(inv.onlineAt){
    const live = LIVE && LIVE.id===inv.id ? LIVE.ok : null;
    card.append(h("div",{class:"row", style:"margin-bottom:8px;font-size:.84rem"},
      h("span",{style:"color:"+(live===false?"var(--red)":"var(--done)")+";font-weight:800"}, live===false ? "● hors ligne" : "● en direct"),
      h("span",{class:"grow muted"}," · "+inv.responses.filter(r=>r.web).length+" réponse(s) en ligne · publiée le "+fmtDateShort(inv.onlineAt.slice(0,10))+" "+inv.onlineAt.slice(11,16)),
      h("button",{class:"btn ghost sm", onclick:()=>onlinePull(inv)},"🔄")));
    card.append(h("input",{ class:"plain", readonly:true, value:link, style:"font-size:12px;padding:6px 8px", onclick:e=>e.target.select() }));
    card.append(h("div",{class:"row wrap", style:"margin-top:8px"},
      h("button",{class:"btn amber grow", onclick:()=>shareLink(inv)},"📤 Envoyer le lien"),
      h("a",{class:"btn light grow", href:link, target:"_blank", rel:"noopener", style:"text-decoration:none;text-align:center"},"👁 Voir la page")));
    card.append(h("div",{class:"row wrap", style:"margin-top:8px"},
      h("button",{class:"btn ghost grow", onclick:()=>onlinePublish(inv)},"⬆ Mettre à jour (catalogue modifié)"),
      h("button",{class:"btn ghost grow", onclick:()=>{ inv.onlineClosed = !inv.onlineClosed; onlinePublish(inv); }}, inv.onlineClosed ? "🔓 Rouvrir les choix" : "🔒 Clore les choix")));
  } else {
    card.append(h("div",{class:"muted small", style:"margin-bottom:8px"},"Tes invités ouvrent un lien, choisissent leurs moules et "+(+inv.pickScents||3)+" parfums. Les moules pris s'affichent en direct chez tout le monde, et leurs choix arrivent ici tout seuls."));
    card.append(h("button",{class:"btn amber block", style:"padding:13px", onclick:()=>onlinePublish(inv)},"🌐 Mettre l'invitation en ligne"));
  }
  return card;
}

/* ---------- Réglage unique des adresses en ligne (Réglages + liste de Préparation) ---------- */
function onlineSettingsCard(compact){
  const S = state.settings;
  const bad = /console\.firebase/i.test(S.fbUrl||"");
  const ok = fbBase() && siteBase() && !bad;
  if(compact && ok && !state.ui.onlineSetup) return h("div",{class:"row muted small", style:"margin:0 0 10px"},
    h("span",{class:"grow"},"🌐 Invitation en ligne réglée pour tous les ateliers"),
    h("button",{class:"btn ghost sm", onclick:()=>{ state.ui.onlineSetup = true; rerender(); }},"⚙ Modifier"));
  const card = h("div",{class:"card", style:"border-left:4px solid var(--blue)"}, h("h2",{},"🌐 Invitation en ligne"),
    h("div",{class:"muted small", style:"margin-bottom:8px"},"À régler une seule fois, valable pour tous les ateliers. Ces adresses restent dans ce navigateur, elles ne sont pas dans le code publié."));
  card.append(field("Adresse de ta base Firebase", inp(S,"fbUrl",{ type:"url", ph:"https://…firebasedatabase.app", cls:"plain" })));
  if(bad) card.append(h("div",{class:"warn"},"⚠ C'est le lien de la console. Il faut l'adresse affichée en haut de la page « Données » de Realtime Database (elle se termine par firebasedatabase.app ou firebaseio.com)."));
  card.append(field("Adresse du site", inp(S,"siteUrl",{ type:"url", ph: siteBase() || "https://ton-pseudo.github.io/atelier-bougies/", cls:"plain" })));
  if(!S.siteUrl && siteBase()) card.append(h("div",{class:"muted small", style:"margin:-4px 0 8px"},"Vide = adresse actuelle : "+siteBase()));
  card.append(h("button",{class:"btn block", onclick:()=>{ state.ui.onlineSetup = false; saveNow(); rerender(); toast(fbBase() && !/console\.firebase/i.test(S.fbUrl||"") ? "Adresses enregistrées ✓" : "⚠ Adresse de la base à vérifier"); }},"Enregistrer"));
  return card;
}

try{ upgradeMoldsReady(); saveNow(); }catch(e){}
render();
